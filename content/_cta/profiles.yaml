# CTA profiles. Each page's `cta_profile` must name one of these.
# Schema and invariants: src/lib/cta/profiles.ts. The CTA matrix in AGENTS.md is
# encoded there as a test oracle, so a profile can be made stricter but never looser.
#
# Selection order on every page: safety -> understand -> act for free -> get care or buy.
# Commercial categories name the TYPE of offer; real partners are configured in
# partners.yaml (Phase 6) and stay disabled until verified.
# Placement "after_evidence" means after the opening answer and the evidence sections.
# A commercial block never appears inside or beside an urgent section, whatever the profile.

profiles:
  learn_stage:
    label: Learning pages (what is perimenopause, stages, age)
    matrix_row: "Learn: Symptom checklist or tracker; commercial usually none"
    free:
      - { kind: tool, target: /tools/symptoms-checklist/, purpose: "See which symptoms may fit, with links to each symptom page" }
      - { kind: tool, target: /tools/symptom-tracker/, purpose: Start a private log to take to an appointment }
      - { kind: email_sequence, target: perimenopause_basics, purpose: Optional basics sequence with clear consent }
    commercial_allowed: []
    commercial_never: [supplement_as_treatment, generic_supplement]
    placement: none
    max_commercial_blocks: 0
    clinician_approval_required: false
    sticky_mobile_cta: false

  vasomotor:
    label: Hot flashes and night sweats
    matrix_row: "Hot flashes, night sweats"
    free:
      - { kind: tool, target: /tools/symptom-tracker/, purpose: Track episodes for two weeks and bring the report }
      - { kind: tool, target: /tools/treatment-questions/, purpose: Build treatment questions for a clinician }
    commercial_allowed: [telehealth, cbt_program, comfort_bedding]
    commercial_never: [supplement_as_treatment, cooling_product_as_treatment, generic_supplement]
    placement: after_evidence
    max_commercial_blocks: 1
    clinician_approval_required: false
    sticky_mobile_cta: false
    copy_examples:
      - "Waking up soaked? Track two weeks of nights and bring the report to your appointment."
      - "Want to discuss prescription options? Compare menopause clinicians by cost, insurance and treatment range. We may earn a commission."
    notes: Telehealth must cover hormonal AND non-hormonal options. Bedding is labelled comfort only, never a treatment.

  sleep:
    label: Insomnia and night waking
    matrix_row: "Insomnia, 3 a.m. waking"
    free:
      - { kind: tool, target: /tools/symptom-tracker/, purpose: Sleep and night-sweat log }
      - { kind: email_sequence, target: sleep, purpose: Optional sleep sequence with clear consent }
    commercial_allowed: [cbt_i_program, telehealth]
    commercial_never: [sleep_supplement, supplement_as_treatment]
    placement: after_evidence
    max_commercial_blocks: 1
    clinician_approval_required: false
    sticky_mobile_cta: false
    notes: Telehealth only when the page links poor sleep to night sweats. The CBT-I programme must be credible.

  fatigue:
    label: Fatigue
    matrix_row: "Fatigue"
    free:
      - { kind: question_list, target: /symptoms/fatigue/, purpose: Doctor checklist for other causes of tiredness }
    commercial_allowed: [telehealth]
    commercial_never: [energy_supplement, supplement_as_treatment]
    placement: after_section
    after_section_id: other-causes
    max_commercial_blocks: 1
    clinician_approval_required: false
    sticky_mobile_cta: false

  mood:
    label: Anxiety, panic, irritability and low mood
    matrix_row: "Anxiety, panic, irritability, low mood"
    free:
      - { kind: tool, target: /tools/symptom-tracker/, purpose: Mood log to share with a doctor }
      - { kind: urgent_guidance, target: /urgent-help/, purpose: "Crisis lines, always visible on these pages" }
    commercial_allowed: [therapy_service, cbt_program, telehealth]
    commercial_never: [mood_supplement, supplement_as_treatment]
    placement: after_evidence
    max_commercial_blocks: 1
    clinician_approval_required: false
    sticky_mobile_cta: false
    notes: No offer beside crisis content. Pages with the `crisis` safety flag carry no commercial links at all (validate:cta).

  cognitive:
    label: Brain fog and memory
    matrix_row: "Brain fog, memory"
    free:
      - { kind: tool, target: /tools/symptom-tracker/, purpose: Symptom log }
      - { kind: question_list, target: /symptoms/brain-fog/, purpose: Other-causes checklist and doctor questions }
    commercial_allowed: [telehealth]
    commercial_never: [nootropic, supplement_as_treatment]
    placement: after_section
    after_section_id: other-causes
    max_commercial_blocks: 1
    clinician_approval_required: false
    sticky_mobile_cta: false
    copy_examples:
      - "Check what else could be causing this, then get a list of questions for your doctor."

  cardio_urgent:
    label: Palpitations, dizziness, chest symptoms
    matrix_row: "Palpitations, dizziness, chest symptoms"
    free:
      - { kind: urgent_guidance, target: /urgent-help/, purpose: Urgent-care guidance first }
      - { kind: question_list, target: /tools/treatment-questions/, purpose: Clinician questions }
    commercial_allowed: [telehealth]
    commercial_never: [supplement_as_treatment, generic_supplement]
    placement: after_section
    after_section_id: when-to-see-a-doctor
    max_commercial_blocks: 1
    clinician_approval_required: true
    sticky_mobile_cta: false
    notes: Only outside the urgent section, and only if a clinician approves the placement.

  weight:
    label: Weight gain and belly fat
    matrix_row: "Weight gain, belly fat"
    free:
