    max_commercial_blocks: 1
    clinician_approval_required: false
    sticky_mobile_cta: false
    notes: Telehealth only when not urgent. No offer near fever or severe pain guidance.

  skin_hair:
    label: Hair, skin and itching
    matrix_row: "Hair, skin, itching"
    free:
      - { kind: question_list, target: /symptoms/hair-thinning/, purpose: Other-causes checklist }
    commercial_allowed: [dermatology_care]
    commercial_never: [collagen_claims, hair_growth_promise, supplement_as_treatment]
    placement: after_section
    after_section_id: other-causes
    max_commercial_blocks: 1
    clinician_approval_required: false
    sticky_mobile_cta: false
    notes: Only evidence-backed topical or dermatology care, and only where the page supports it.

  general_symptom:
    label: Other symptoms (headaches, digestion, eyes, mouth, ears, odor, tingling, breast tenderness)
