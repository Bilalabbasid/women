    commercial_allowed: [lubricants_moisturizers, telehealth]
    commercial_never: [vaginal_rejuvenation, supplement_as_treatment]
    placement: after_evidence
    max_commercial_blocks: 1
    clinician_approval_required: false
    sticky_mobile_cta: false
    copy_examples:
