    commercial_allowed: [sexual_health_telehealth, lubricants_moisturizers]
    commercial_never: [libido_supplement, supplement_as_treatment]
    placement: after_evidence
    max_commercial_blocks: 1
    clinician_approval_required: false
    sticky_mobile_cta: false

  urinary:
    label: Bladder symptoms and UTIs
    matrix_row: "Bladder symptoms, UTIs"
    free:
      - { kind: tool, target: /tools/symptom-tracker/, purpose: Symptom log }
      - { kind: urgent_guidance, target: /urgent-help/, purpose: When to seek urgent care }
    commercial_allowed: [telehealth]
    commercial_never: [cranberry_cure_claims, supplement_as_treatment]
