  population: Women presenting with breast pain (mastalgia) in primary care
  key_finding: "Mastalgia affects up to 70% of women in their lifetime. Cyclical
    pain (two-thirds of true mastalgia) is hormone-related, worsening in the
    week before menses and relieved at onset; non-cyclical (one-third) includes
    cysts, pregnancy, trauma, and mastitis/abscess (erythema, swelling, focal
    pain). Extra-mammary chest-wall pain (e.g. costochondritis) is now the
    commonest type referred to breast clinics, treated with NSAIDs. Per NICE:
    breast pain alone is not a criterion for urgent cancer referral (positive
    predictive value under 3%); routine referral is considered if cyclical pain
    affects quality of life or sleep for more than 3 months and is unresponsive
    to first-line care. A well-fitting bra can fully resolve symptoms per
    multiple studies. Topical NSAIDs (diclofenac/piroxicam) are first-line
    treatment. Evening primrose oil, vitamin E, pyridoxine, and diuretics have
    no proven efficacy and are not recommended by NICE."
