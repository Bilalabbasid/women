# ---------------------------------------------------------------- Prompt 3 Verified Clinical & Reference Sources

- id: nams-2020-gsm
  title: The 2020 genitourinary syndrome of menopause position statement of The North American Menopause Society
  authors: []
  publisher: "Menopause: The Journal of The Menopause Society"
  year: 2020
  type: position_statement
  url: https://pubmed.ncbi.nlm.nih.gov/32852449/
  doi: 10.1097/GME.0000000000001609
  accessed: "2026-11-06"
  population: Menopausal women experiencing genitourinary symptoms
  key_finding: First-line non-hormonal management for vaginal dryness and dyspareunia consists of regular vaginal moisturisers and personal lubricants during intercourse. For persistent moderate-to-severe symptoms, low-dose vaginal estrogen is highly effective and generally safe.
  funding_conflict: null
  verified: true

- id: acog-clinical-consensus-gsm
  title: "Treatment of Symptoms of the Genitourinary Syndrome of Menopause: Clinical Consensus No. 2"
  authors: []
  publisher: American College of Obstetricians and Gynecologists
  year: 2021
  type: guideline
  url: https://www.acog.org/clinical/clinical-guidance/clinical-consensus/articles/2021/12/treatment-of-symptoms-of-the-genitourinary-syndrome-of-menopause
  doi: null
  accessed: "2026-11-06"
  population: Women with genitourinary syndrome of menopause
  key_finding: Over-the-counter vaginal moisturisers used several times per week provide continuous tissue hydration, whereas lubricants reduce friction specifically during sexual activity. Both are recommended as first-line therapy before or alongside prescription options.
  funding_conflict: null
  verified: true

- id: cochrane-vaginal-moisturizers
  title: Non-hormonal interventions for genitourinary syndrome of menopause
  authors: []
  publisher: Cochrane Database of Systematic Reviews
  year: 2021
  type: systematic_review
  url: https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD014761/full
  doi: 10.1002/14651858.CD014761
  accessed: "2026-11-06"
  population: Postmenopausal women with vaginal atrophy
  key_finding: Non-hormonal moisturisers (including polycarbophil and hyaluronic acid) improve vaginal dryness and comfort compared to baseline, though low-dose vaginal estrogen provides superior mucosal maturation and tissue elasticity.
  funding_conflict: null
  verified: true

- id: nice-ng123-urinary-incontinence
  title: "Urinary incontinence and pelvic organ prolapse in women: management (NG123)"
  authors: []
  publisher: National Institute for Health and Care Excellence
  year: 2019
  type: guideline
  url: https://www.nice.org.uk/guidance/ng123
  doi: null
  accessed: "2026-11-06"
  population: Women with stress, urge, or mixed urinary incontinence
  key_finding: Offer a trial of supervised pelvic floor muscle training of at least 3 months duration as first-line treatment to women with stress or mixed urinary incontinence. Pelvic floor muscle training should comprise at least 8 contractions performed 3 times per day.
  funding_conflict: null
  verified: true

- id: cochrane-pfmt-incontinence
  title: Pelvic floor muscle training versus no treatment, or inactive control treatments, for urinary incontinence in women
  authors: []
  publisher: Cochrane Database of Systematic Reviews
  year: 2018
  type: systematic_review
  url: https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD005654.pub4/full
