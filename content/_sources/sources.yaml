- id: fda-mht-labeling-changes-2026
  title: FDA Approves Labeling Changes to Menopausal Hormone Therapy Products
  authors: []
  publisher: U.S. Food and Drug Administration
  year: 2026
  type: regulator_statement
  url: https://www.fda.gov/news-events/press-announcements/fda-approves-labeling-changes-menopausal-hormone-therapy-products
  doi: null
  accessed: 2026-11-06
  population: U.S. prescribing labels for menopausal hormone therapy products
  key_finding: On February 12, 2026 the FDA approved labeling changes to six
    menopausal hormone therapy products, removing risk statements on
    cardiovascular disease, breast cancer and probable dementia from the boxed
    warning. 29 companies had submitted proposed changes; the first six span
    systemic combination, systemic estrogen-alone, systemic progestogen-alone
    and vaginal estrogen products.
  funding_conflict: null
  verified: true
  notes: Trade press (Contemporary OB/GYN, 2026-10-30) reports three more
    estradiol patches approved on October 30, 2026; that report cites an HHS
    release we have not yet opened, so it is not used.
- id: fda-mht-labeling-request-2025
  title: FDA Requests Labeling Changes Related to Safety Information to Clarify
    the Benefit/Risk Considerations for Menopausal Hormone Therapies
  authors: []
  publisher: U.S. Food and Drug Administration
  year: 2025
  type: regulator_statement
  url: https://www.fda.gov/drugs/drug-alerts-and-statements/fda-requests-labeling-changes-related-safety-information-clarify-benefitrisk-considerations
  doi: null
  accessed: 2026-11-06
  population: U.S. prescribing labels for menopausal hormone therapy products
  key_finding: On November 10, 2025 the FDA asked makers to remove cardiovascular
    disease, breast cancer and probable dementia language from the boxed
    warning, remove endometrial cancer boxed language except for systemic
    estrogen-alone products, and remove the 'lowest effective dose for the
    shortest time' recommendation. For systemic products, labels add
    consideration of starting therapy for moderate to severe hot flashes before
    age 60 or within 10 years of menopause, and retain cardiovascular and breast
    cancer information in the warnings.
  funding_conflict: null
  verified: true
