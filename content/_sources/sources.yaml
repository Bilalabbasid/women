- id: nhs-types-of-hrt
  title: Types of hormone replacement therapy (HRT)
  authors: []
  publisher: NHS (UK)
  year: 2023
  type: patient_information
  url: https://www.nhs.uk/medicines/hormone-replacement-therapy-hrt/types-of-hormone-replacement-therapy-hrt/
  doi: null
  accessed: 2026-11-09
  population: General public (UK) considering HRT
  key_finding: HRT comes as tablets, patches, gel, spray, or vaginal rings, pessaries or cream. Oestrogen-only HRT is recommended after a hysterectomy and is taken every day. Sequential (cyclical) combined HRT means oestrogen every day plus a progestogen for the last 10 to 14 days of the cycle; it is used if you are still having regular periods, and a bleed is expected at the end of each progestogen course. Continuous combined HRT (oestrogen and progestogen every day) is usually recommended post-menopause, after 1 year without a period. Vaginal oestrogen does not carry the usual risks of HRT and does not help hot flushes, mood swings or sleep problems.
  funding_conflict: null
  verified: true
  notes: Page last reviewed 9 March 2023 (next review was due 9 March 2026). UK patient guidance; pair with NAMS 2022 or NICE NG23 for US readers.

