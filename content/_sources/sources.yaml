- id: nhs-hrt-side-effects-2023
  title: Side effects of hormone replacement therapy (HRT)
  authors: []
  publisher: NHS (UK)
  year: 2023
  type: patient_information
  url: https://www.nhs.uk/medicines/hormone-replacement-therapy-hrt/side-effects-of-hormone-replacement-therapy-hrt/
  doi: null
  accessed: 2026-11-11
  population: General public (UK) taking HRT
  key_finding: Estrogen side effects include headaches, breast pain or tenderness, unexpected vaginal bleeding or spotting, nausea, mood changes, leg cramps, mild rash or itching, diarrhea and hair loss. Progestogen side effects include changes in periods or spotting, headaches, breast pain or tenderness, nausea, diarrhea, feeling tired or dizzy, mood changes, mild rash and acne. Side effects usually improve over time and often go away after a few weeks; carry on for at least 3 months if possible; speak to a GP if side effects are severe or last longer than 3 months. A GP might suggest changing the dose, the type of HRT or how it is taken (for example tablets to patches). Bleeding usually settles within 6 months; speak to a GP about irregular bleeding for more than 6 months, heavier bleeding, or bleeding after periods had stopped for a while. There is little evidence that most types of HRT cause weight gain.
  funding_conflict: null
  verified: true
  notes: Page last reviewed 3 January 2023. UK patient guidance. Read via WebFetch on 2026-11-11.

