- id: nhs-night-sweats
  title: Night sweats
  authors: []
  publisher: NHS (nhs.uk)
  year: 2023
  type: patient_information
  url: https://www.nhs.uk/conditions/night-sweats/
  doi: null
  accessed: 2026-11-08
  population: General public (UK)
  key_finding: "It is normal to sweat at night if the room or bedding is too hot.
    Common causes of night sweats: menopause symptoms (hot flushes), anxiety,
    medicines such as some antidepressants, steroids and painkillers, low blood
    sugar (hypoglycaemia), alcohol or drug use, and hyperhidrosis (a harmless
    condition that makes you sweat too much all the time); sometimes the cause
    is unknown. See a GP if night sweats regularly wake you up or worry you, if
    you also have a very high temperature (or feel hot, cold or shivery), a
    cough or diarrhoea, or if you have night sweats and are losing weight for no
    reason."
