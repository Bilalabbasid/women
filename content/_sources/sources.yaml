  url: https://pubmed.ncbi.nlm.nih.gov/30843880/
  doi: 10.1172/jci.insight.124865
  accessed: 2026-11-07
  population: SWAN (Study of Women's Health Across the Nation) longitudinal
    cohort, DEXA-based body composition measures across the menopause transition
  key_finding: Fat and lean mass both increased before the menopause transition
    (MT). At MT onset, the rate of fat gain doubled and lean mass began
    declining; both continued until 2 years after the final menstrual period
    (FMP), then flattened to zero slope. Weight itself climbed linearly during
    premenopause with no acceleration at the start of the MT, and its trajectory
    became flat after the MT - the authors conclude there is no discernible
    change in the rate of weight gain at the start of the transition, despite
    the real underlying shift from lean to fat mass.
  funding_conflict: null
  verified: true
  notes: NIH-funded (National Institute on Aging, National Institute of Nursing
    Research, NIH Office of Research on Women's Health); no conflict of interest
    declared.
- id: kravitz-swan-postmenopause-depression-2022
  title: "Risk of high depressive symptoms after the final menstrual period: the
    Study of Women's Health Across the Nation (SWAN)"
  authors:
    - Kravitz HM
    - Colvin AB
    - Avis NE
    - Joffe H
    - Chen Y
    - Bromberger JT
  publisher: Menopause
  year: 2022
  type: cohort
  url: https://pubmed.ncbi.nlm.nih.gov/35796553/
  doi: 10.1097/GME.0000000000001988
  accessed: 2026-11-07
  population: 1,551 midlife women, SWAN cohort, 1996-2017, median 19.0-year follow-up
  key_finding: "Women had higher odds of a high depressive-symptom score during
    postmenopause than when premenopausal (OR 1.49, 95% CI 1.09-2.04); not
    significantly different for perimenopause vs. premenopause. Three pre-FMP
    depressive-symptom trajectories were identified: consistently low (47.7% of
    women), moderate (39.9%), and consistently high (12.4%). Compared with the
    consistently-low group, both the moderate (OR 2.62, 95% CI 1.89-3.66) and
    high (OR 6.88, 95% CI 4.72-10.02) trajectory groups had significantly higher
    postmenopausal depressive symptoms. Other pre-FMP factors associated with
    high postmenopausal depressive symptoms: childhood trauma/maltreatment, poor
    physical role functioning, high anxiety, sleep problems, high vasomotor
    symptoms, younger age, and lower social support."
  funding_conflict: All authors report NIH grant funding for this study (NIA; NCI
    and NIMH for some). One co-author (Joffe) additionally discloses grants from
    Merck and Pfizer and consulting fees from NeRRe/KaNDy, Eisai, Jazz, and
