# ---------------------------------------------------------------- Society guidelines and statements

- id: nams-2022-hormone-therapy
  title: The 2022 hormone therapy position statement of The North American Menopause Society
  authors: [The 2022 Hormone Therapy Position Statement Advisory Panel]
  publisher: "Menopause (The North American Menopause Society, now The Menopause Society)"
  year: 2022
  type: position_statement
  url: https://menopause.org/wp-content/uploads/professional/nams-2022-hormone-therapy-position-statement.pdf
  doi: 10.1097/GME.0000000000002028
  accessed: "2026-11-06"
  population: Peri- and postmenopausal women
  key_finding: Hormone therapy is the most effective treatment for vasomotor symptoms and genitourinary syndrome of menopause, and prevents bone loss and fracture. For women under 60 or within 10 years of menopause without contraindications, the benefit-risk ratio is favorable; starting more than 10 years after menopause or after 60 is less favorable because of greater absolute risks of coronary heart disease, stroke, venous thromboembolism and dementia.
  funding_conflict: Funded by donations to the NAMS Education & Research Fund; the statement reports no commercial support. Individual panel disclosures not yet reviewed.
  verified: true

- id: nams-2023-nonhormone-therapy
  title: The 2023 nonhormone therapy position statement of The North American Menopause Society
  authors: [Shufelt CL, Brown V, Carpenter JS, Chism LA, Faubion SS, Joffe H, Kling JM, Soares CN, Thurston RC]
  publisher: "Menopause (The North American Menopause Society, now The Menopause Society)"
  year: 2023
  type: position_statement
  url: https://pubmed.ncbi.nlm.nih.gov/37252752/
  doi: 10.1097/GME.0000000000002200
  accessed: "2026-11-06"
  population: Women with menopause-associated vasomotor symptoms
  key_finding: "Recommended for hot flashes: CBT, clinical hypnosis, SSRIs/SNRIs, gabapentin, fezolinetant (Level I); oxybutynin (Levels I-II); weight loss and stellate ganglion block (Levels II-III). Not recommended: paced respiration (Level I); supplements and herbal remedies (Levels I-II); cooling techniques, avoiding triggers, exercise, yoga, mindfulness, relaxation, soy foods and extracts, equol, cannabinoids and acupuncture (Level II); clonidine and chiropractic (Levels I-III); dietary modification and pregabalin (Level III)."
  funding_conflict: null
  verified: true
  notes: Panel disclosures not yet reviewed. "Not recommended" here means the panel did not recommend the therapy for hot flashes; some reviewers read it as "not first-line" (research plan). Present that nuance on each page.

