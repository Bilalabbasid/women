- id: ods-ashwagandha-hp-2025
  title: "Ashwagandha: Is it helpful for stress, anxiety, or sleep? Health
    Professional Fact Sheet"
  authors:
    - NIH Office of Dietary Supplements
  publisher: National Institutes of Health, Office of Dietary Supplements
  year: 2025
  type: patient_information
  url: https://ods.od.nih.gov/factsheets/Ashwagandha-HealthProfessional/
  doi: null
  accessed: 2026-11-08
  population: Adults (evidence review of ashwagandha trials and case reports; not
    menopause-specific)
  key_finding: "Ashwagandha appears well tolerated for up to about 3 months;
    long-term safety is not known. Common mild side effects: stomach upset,
    loose stools, nausea, drowsiness. Case reports link it to acute liver injury
    (signs included jaundice, pruritus, nausea, lethargy, abdominal discomfort,
    hyperbilirubinemia; people improved after stopping; product contents not
    always verified). It may raise thyroid hormone levels; three case reports of
    thyrotoxicosis; might interact with thyroid hormone medications, and also
    antidiabetes medications, antihypertensives, immunosuppressants and
    sedatives. Some experts advise against use in pregnancy; ANSES (2024)
    recommended against use in pregnant and breastfeeding women and people with
    endocrine disorders; Denmark banned ashwagandha in 2023. Studies used varied
    preparations and doses, so specific extracts or amounts are hard to
    identify."
  funding_conflict: null
  verified: true
  notes: Updated May 2, 2025. Fetched full text 2026-11-08 (direct fetch returned
