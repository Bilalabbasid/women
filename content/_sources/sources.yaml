- id: owh-menopause-treatment-2026
  title: Menopause treatment
  authors: []
  publisher: Office on Women's Health, U.S. Department of Health and Human Services
  year: 2026
  type: patient_information
  url: https://womenshealth.gov/menopause/menopause-treatment
  doi: null
