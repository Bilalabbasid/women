  key_finding: "The most common reason for bloating is a lot of gas in the gut, from certain foods and drinks or swallowing air; digestive problems such as constipation, food intolerance, coeliac disease and IBS can also cause it, some people feel bloated around their period, and persistent bloating can occasionally be a sign of something more serious such as ovarian cancer. Do: exercise regularly, chew with your mouth closed, drink plenty of water, eat soluble-fiber foods such as oats or linseed if constipated, eat smaller more frequent meals, gently massage the stomach. Don't: have lots of fizzy drinks, alcohol or caffeine; eat large amounts of gas-producing foods such as cabbage, beans or lentils; eat big meals late at night or slouch while eating; eat lots of processed, sugary, spicy or fatty foods; eat foods you're intolerant to. See a GP if you feel bloated regularly, keep feeling bloated after changing your diet, or have bloating with unintentional weight loss or blood in your poo. Urgent: bloating with vomiting, diarrhea or constipation, stomach ache, fever, a swelling or lump in the tummy, being unable to pee, poo or fart. Emergency (999/A&E): swollen stomach with sudden severe stomach ache, vomiting blood, or severe breathing difficulty."
  funding_conflict: null
  verified: true
  notes: Page last reviewed 21 January 2026.

