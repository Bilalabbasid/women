- id: vani-ashwagandha-menopause-rct-2026
  title: A prospective, randomized, double-blind, placebo-controlled study on
    efficacy and safety of Ashwagandha root extract (Withania somnifera) for
    managing menopausal symptoms in women
  authors:
    - Vani I
    - Muralidhar G
    - Rao BS
  publisher: Frontiers in Reproductive Health
  year: 2026
  type: small_study
  url: https://pubmed.ncbi.nlm.nih.gov/41561822/
  doi: 10.3389/frph.2025.1647721
  accessed: 2026-11-08
  population: 60 women aged 45-55 with menopausal symptoms, single government
    hospital in India; 56-day RCT (30 per group)
  key_finding: 300 mg ashwagandha root extract twice daily vs placebo for 56 days.
    Significant reduction in total Menopause Rating Scale score (p<0.0001) and
    its psychological, somatic and urogenital domains; fewer hot flash events
    (p<0.001); lower Perceived Stress Scale scores; higher SF-12 quality of
    life; higher serum estradiol and progesterone and lower FSH and LH vs
    placebo. 3 women reported adverse events (1 ashwagandha, 2 placebo); none
    stopped because of them.
