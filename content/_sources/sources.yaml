  population: U.S. women considering menopausal hormone therapy
  key_finding: The FDA is not seeking to remove the boxed warning for endometrial cancer on systemic estrogen-alone products, and its labeled recommendation will be to start systemic HRT within 10 years of menopause onset or before age 60.
