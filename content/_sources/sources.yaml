  authors: []
  publisher: Mayo Clinic
  year: 2019
  type: patient_information
  url: https://www.mayoclinic.org/diseases-conditions/chronic-daily-headaches/symptoms-causes/syc-20370891
  doi: null
  accessed: 2026-11-11
  population: General public (US)
  key_finding: "Chronic daily headaches are headaches on 15 days or more a month for longer than three months; they are a group of headache types (chronic migraine, chronic tension-type headache, new daily persistent headache, hemicrania continua), not one type. Medication overuse headache usually develops in people with migraine or tension-type headache who take too much pain medicine; taking pain medicines, even over-the-counter ones, more than two days a week (or nine days a month) puts you at risk of rebound headaches. See a doctor if you usually have two or more headaches a week, take a pain reliever most days, need more than the recommended over-the-counter dose, your headache pattern changes or headaches worsen, or headaches are disabling. Seek prompt care for a sudden severe headache, one with fever, stiff neck, confusion, seizure, double vision, weakness, numbness or trouble speaking, one after a head injury, or one that gets worse despite rest and pain medicine. Prevention: keep a headache diary, avoid medication overuse (ask a doctor how to cut back, since stopping improperly can cause serious side effects), regular sleep, regular meals, regular exercise, stress reduction, and less caffeine. Risk factors for frequent headaches include female sex, anxiety, depression, sleep disturbances, obesity, snoring, and overuse of caffeine or headache medicine."
  funding_conflict: null
  verified: true
  notes: Page dated April 09, 2019. Page does not mention menopause.

- id: harlow-aub-fatigue-swan-2025
  title: Abnormal uterine bleeding is associated with fatigue during the menopause transition
  authors:
    - Harlow SD
    - Gold EB
    - Hood MM
    - Mukwege AA
    - Randolph JF
    - Greendale GA
  publisher: Menopause (The Menopause Society)
  year: 2025
  type: cohort
  url: https://pubmed.ncbi.nlm.nih.gov/40067756/
  doi: 10.1097/GME.0000000000002525
  accessed: 2026-11-11
  population: 2,329 midlife women in the Study of Women's Health Across the Nation (SWAN) with daily menstrual calendar data
  key_finding: After adjusting for age, body mass index, hormone therapy, depressive and anxiety symptoms, stress, sleep problems, smoking and other factors, three or more episodes of heavy menstrual bleeding in the prior 6 months were linked with feeling tired (OR 1.62, 95% CI 1.11 to 2.38), and three or more episodes of prolonged bleeding with being less likely to feel full of pep (OR 0.68, 95% CI 0.49 to 0.95). Authors call for more clinical attention to bleeding changes and associated fatigue and lack of energy during the menopause transition.
  funding_conflict: One author reports a past financial relationship with CVS; others report none.
  verified: true
  notes: "Menopause 2025 Mar 11, online ahead of print. PMID 40067756. Abstract read via NCBI E-utilities efetch on 2026-11-11; The Menopause Society press release (March 2025) also opened. Observational: shows an association, not cause."

