- id: collaborative-group-mht-breast-cancer-2019
  title: "Type and timing of menopausal hormone therapy and breast cancer risk: individual participant meta-analysis of the worldwide epidemiological evidence"
  authors:
    - Collaborative Group on Hormonal Factors in Breast Cancer
  publisher: The Lancet
  year: 2019
  type: systematic_review
  url: https://pubmed.ncbi.nlm.nih.gov/31474332/
  doi: 10.1016/S0140-6736(19)31709-X
  accessed: 2026-11-11
  population: 108,647 postmenopausal women who developed breast cancer in prospective studies worldwide (individual participant data)
  key_finding: Every hormone therapy type except vaginal estrogens was associated with excess breast cancer risk, which rose with duration of use and was greater for estrogen-progestagen than estrogen-only preparations. Risk was greater with daily than less frequent progestagen use. After stopping, some excess risk persisted for more than 10 years, with little excess after less than 1 year of use. If largely causal, 5 years of use from age 50 would increase breast cancer incidence at ages 50 to 69 by about 1 in 50 users of estrogen plus daily progestagen, 1 in 70 users of estrogen plus intermittent progestagen, and 1 in 200 users of estrogen-only preparations; 10 years of use would roughly double these excesses.
  funding_conflict: Funded by Cancer Research UK and the Medical Research Council.
  verified: true
  notes: Observational data; read via the PubMed abstract (NCBI efetch) on 2026-11-11.

