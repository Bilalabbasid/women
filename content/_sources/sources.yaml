- id: kamp-menopause-hair-disorders-2022
  title: "Menopause, skin and common dermatoses. Part 1: hair disorders"
  authors: [Kamp E, Ashraf M, Musbahi E, DeGiovanni C]
  publisher: Clinical and Experimental Dermatology
  year: 2022
  type: other
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10092469/
  doi: 10.1111/ced.15327
  accessed: "2026-11-06"
  population: Peri- and postmenopausal women with hair changes
  key_finding: "Literature review. A reduction in anagen (growth-phase) hairs is seen in postmenopausal women, more apparent frontally than occipitally. Female pattern hair loss (FPHL): frontovertical thinning with a preserved frontal hairline; most patients have normal androgen levels; testosterone/prolactin testing is warranted only if other signs of androgen excess (hirsutism, severe acne, irregular menses) are present. There is insufficient evidence to support the role of HRT in FPHL; first-line treatment is topical minoxidil (2% solution 1-2 times/day, or 5% foam once daily). Frontal fibrosing alopecia is also associated with the perimenopausal state. Facial hirsutism is seen in about 50% of postmenopausal women, usually with normal androgen levels."
  funding_conflict: null
  verified: true
  notes: "Confirmed against the full open-access text (PMC), not just the abstract, since the specific treatment/prevalence figures aren't in the abstract."

- id: viscomi-menopausal-skin-hrt-2025
  title: "Managing Menopausal Skin Changes: A Narrative Review of Skin Quality Changes, Their Aesthetic Impact, and the Actual Role of Hormone Replacement Therapy in Improvement"
  authors: [Viscomi B, Muniz M, Sattler S]
  publisher: Journal of Cosmetic Dermatology
  year: 2025
