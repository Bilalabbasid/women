    in androgens (clinical hyperandrogenism) as the major driver, also
    manifesting as hirsutism and androgenetic alopecia. Most menopausal women
    with isolated, limited acne have normal (normoandrogenic) serum levels and
    don't need extensive investigation, though baseline total testosterone is
    useful. Prolonged topical therapy is the mainstay for mild acne without
    virilization; combined oral contraceptives are effective but relatively
    contraindicated postmenopause; spironolactone is the first-choice oral
