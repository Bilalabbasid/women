  notes: The fact sheet also states relative benefits (for example a 50% reduction in heart attack risk and 35% lower Alzheimer's risk) without inline citations. Do not repeat these figures; see content/_review/unverified-claims.md.

- id: veozah-prescribing-information
  title: VEOZAH (fezolinetant) tablets, prescribing information
  authors: []
  publisher: Astellas Pharma US
  year: 2026
  type: regulator_label
  url: https://www.astellas.com/content/dam/astellas-com/global/en/documents/veozah_uspi.pdf
  doi: null
  accessed: "2026-11-06"
  population: Adults with moderate to severe vasomotor symptoms due to menopause
  key_finding: "Boxed warning for hepatotoxicity (added 12/2024). Liver tests before starting, then monthly for the first 3 months and at 6 and 9 months; do not start if aminotransferase or total bilirubin is 2 or more times the upper limit of normal. Contraindicated with known cirrhosis, severe renal impairment or end-stage renal disease, and CYP1A2 inhibitors. Dose: one 45 mg tablet daily."
