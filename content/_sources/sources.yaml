- id: medlineplus-vaginal-uterine-bleeding
  title: "Vaginal or uterine bleeding: MedlinePlus Medical Encyclopedia"
  authors: []
  publisher: MedlinePlus, US National Library of Medicine (NIH)
  year: 2024
  type: patient_information
  url: https://medlineplus.gov/ency/article/007496.htm
  doi: null
  accessed: 2026-11-08
  population: General public (US)
  key_finding: Contact your provider if you soak through a pad or tampon every
    hour for 2 to 3 hours, bleeding lasts longer than 1 week, you bleed and are
    or could be pregnant, have severe pain, periods have been heavier or longer
    than normal for 3 or more cycles, bleed after menopause, between periods or
    after sex, bleeding becomes heavy enough to cause weakness or
    lightheadedness, or you have fever or lower abdominal pain. Causes of
    abnormal uterine bleeding include irregular or absent ovulation (more common
    approaching menopause), fibroids, polyps, adenomyosis, thyroid or pituitary
    disorders, PCOS, pregnancy complications, infection, certain cancers,
    bleeding disorders, IUDs and medicines such as blood thinners.
  funding_conflict: null
  verified: true
  notes: Review date 10/15/2024. Advises contacting a provider; it gives no
    911/emergency threshold for heavy menstrual bleeding.
