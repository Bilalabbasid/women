  population: General public (US)
  key_finding: Menopause is the time in your life when you stop having your period and can no longer get pregnant; you have reached menopause when you have not had a period for 12 months. The most common age for reaching menopause is between 45 and 55. The transition before it (perimenopause) usually begins in your 40s, sometimes earlier, and can last several years. Symptoms include changes in periods, hot flashes, night sweats, trouble sleeping, vaginal dryness, mood changes and bladder problems; lower estrogen can also lower bone density. Surgery to remove both ovaries can cause menopause; removing only the uterus stops periods but does not cause menopause unless the ovaries are also removed. Chemotherapy or hormone treatment for breast cancer can bring on menopause earlier. You may not need treatment for menopause symptoms.
  funding_conflict: null
  verified: true
  notes: Page last updated August 3, 2026. Read via WebFetch on 2026-11-09.

- id: acs-mht-after-breast-cancer-2025
  title: Menopausal Hormone Therapy After Breast Cancer
  authors: []
  publisher: American Cancer Society (medical review by ASCO)
  year: 2025
  type: patient_information
  url: https://www.cancer.org/cancer/types/breast-cancer/living-as-a-breast-cancer-survivor/menopausal-hormone-therapy-after-breast-cancer.html
  doi: null
  accessed: 2026-11-09
  population: Breast cancer survivors (US)
  key_finding: Doctors generally do not recommend menopausal hormone therapy after breast cancer, but there might be exceptions. In the HABITS randomized trial, survivors taking hormone therapy were much more likely to have a new breast cancer or a recurrence. Risk is clearly increased after hormone receptor-positive (ER+ or PR+) cancer, so it is typically not recommended; after ER- and PR- cancer the risk is less clear and some doctors might consider it if non-hormonal treatments are not helping. Chemotherapy, tamoxifen, aromatase inhibitors and other hormone medicines for breast cancer can cause menopause symptoms. Non-hormonal medicines that may help hot flashes include fezolinetant (Veozah) or elinzanetant (Lynkuet), certain antidepressants (some can interact with tamoxifen), gabapentin, clonidine and oxybutynin. Eating soy foods seems to be safe for survivors; it is not clear that phytoestrogen supplements (soy, red clover, black cohosh) are safe after hormone receptor-positive cancer. For vaginal dryness, vaginal moisturizers, lubricants and gels come first; if not helpful, low-dose vaginal hormone products might help, after discussing risks and benefits with the care team.
  funding_conflict: null
  verified: true
  notes: Last revised October 27, 2025. Developed by the ACS medical and editorial content team with medical review by ASCO. Read in full on 2026-11-09.

