  accessed: 2026-11-11
  population: Nine small experimental studies in infants, children, young adults and older adults; none in menopausal women or people with night sweats
  key_finding: Wool sleepwear showed benefits for sleep onset in adults in cool conditions and in older adults in warm conditions; polyester did not differ overall from cotton in older adults; one blended synthetic, quick-drying sleepwear increased deep sleep in adolescent girls; linen bedsheets improved sleep in warm conditions in young adults (one study, bed pad may have mattered); goose-down duvets beat cotton-filled in cool conditions; wool and polyester quilts did not differ. Silk was not studied; bamboo was tested only in a blend for infants. Cotton and wool conduct heat much more once they absorb moisture. Studies were small and varied, and the authors say it is hard to draw an overall conclusion.
  funding_conflict: Chow received research funding from Australian Wool Innovation Ltd, and Li a research scholarship from it (wool industry body).
