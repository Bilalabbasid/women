- id: medlineplus-hirsutism
  title: "Excessive or unwanted hair in women: MedlinePlus Medical Encyclopedia"
  authors: []
  publisher: MedlinePlus, US National Library of Medicine (NIH)
  year: 2025
  type: patient_information
  url: https://medlineplus.gov/ency/article/007622.htm
  doi: null
  accessed: 2026-11-11
  population: General public (US)
  key_finding: Hirsutism is coarse, dark hair in areas where women usually have fine hair (upper lip, chin, chest, abdomen, back). Most of the time it does not cause health problems, though many women find it bothersome. Causes - excess androgens; often runs in families; PCOS is a common cause; less common - thyroid disorders, adrenal or ovarian tumors, Cushing syndrome, congenital adrenal hyperplasia, hyperthecosis; medicines including testosterone, danazol, anabolic steroids, DHEA, glucocorticoids, cyclosporine, minoxidil and phenytoin; rarely hormone levels are normal and no cause is found. Treatment - birth control pills and anti-androgen medicines such as spironolactone for some women; it can take many months of medicine before you notice less hair growth (follicles grow about 6 months before falling out); weight loss for women who are overweight; electrolysis (electric current permanently damages individual hair follicles; expensive, needs multiple treatments); laser (works best on dark hair, not blond or red hair); temporary methods - shaving (does not cause more hair to grow but may make it look thicker), chemicals, plucking, waxing. Contact a provider if hair grows rapidly, if you have male features such as acne, deepening voice, increased muscle mass, male-pattern hair thinning, enlarging clitoris or decreased breast size, or if you think a medicine is increasing hair growth.
  funding_conflict: null
  verified: true
  notes: Opened 2026-11-11. Review date 10/1/2025. Page does not mention menopause or eflornithine.

