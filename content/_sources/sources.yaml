  key_finding: Oral HRT was associated with increased VTE risk vs no exposure (adjusted OR 1.58), for estrogen-only (1.40) and combined (1.73) preparations. Estradiol had a lower risk than conjugated equine estrogen. Conjugated equine estrogen with medroxyprogesterone acetate had the highest risk (2.10); estradiol with dydrogesterone the lowest (1.18, 95% CI 0.98 to 1.42). Transdermal preparations were not associated with VTE risk (0.93, 0.87 to 1.01). Authors concluded transdermal treatment was the safest type for VTE risk.
