- id: owh-early-premature-menopause-2026
  title: Early or premature menopause
  authors:
    - Office on Women's Health
  publisher: U.S. Department of Health and Human Services, Office on Women's Health
  year: 2026
  type: patient_information
  url: https://womenshealth.gov/menopause/early-or-premature-menopause
  doi: null
  accessed: 2026-11-09
  population: General public (US)
  key_finding: Menopause between ages 40 and 44 is early menopause; menopause before age 40 is premature menopause, also called primary ovarian insufficiency (POI). Both can happen on their own or after medical treatment such as surgery to remove both ovaries. Known causes include family history of early menopause, smoking, chemotherapy or pelvic radiation, surgery removing both ovaries, autoimmune conditions such as thyroid disease, and genetic conditions such as Turner syndrome; sometimes there is no clear cause. Tell your provider if periods stop or become irregular before age 45; blood tests are most useful before age 40. Years without estrogen raise the risk of bone loss, heart disease and diabetes. Hormone therapy may help relieve symptoms and protect bones; talk with your provider about whether you also need birth control. Counseling and support groups can help.
  funding_conflict: null
  verified: true
  notes: Page last updated October 19, 2026.

- id: acog-perimenopausal-bleeding-faq
  title: Perimenopausal Bleeding and Bleeding After Menopause (FAQ162)
  authors:
    - American College of Obstetricians and Gynecologists
  publisher: American College of Obstetricians and Gynecologists
  year: 2020
  type: patient_information
  url: https://www.acog.org/womens-health/faqs/perimenopausal-bleeding-and-bleeding-after-menopause
  doi: null
  accessed: 2026-11-09
  population: General public (US)
  key_finding: Perimenopause usually begins in the mid-40s and may last from ages 45 to 55, though timing varies; the average age of the last period in the US is 51. A typical cycle is 24 to 38 days and a period generally lasts up to 8 days. In perimenopause some months the ovaries release an egg and some months they do not; periods may be shorter or longer, the days between may increase or decrease, bleeding may be heavier or lighter, and periods may be skipped. It is not normal to have bleeding or spotting between periods or after sex, heavy bleeding during a period, bleeding that is heavier or lasts more days than usual, or bleeding after menopause. Talk with an ob-gyn about bleeding changes. Causes of abnormal bleeding include polyps, endometrial atrophy, endometrial hyperplasia and endometrial cancer; diagnosis may involve history, exam, endometrial biopsy, pelvic ultrasound, sonohysterography, hysteroscopy or D&C.
  funding_conflict: null
  verified: true
  notes: Last updated October 2020, last reviewed February 2024.

- id: mayo-perimenopause-symptoms-causes-2026
  title: "Perimenopause: Symptoms and causes"
  authors:
    - Mayo Clinic Staff
  publisher: Mayo Clinic
  year: 2026
  type: patient_information
  url: https://www.mayoclinic.org/diseases-conditions/perimenopause/symptoms-causes/syc-20354666
  doi: null
  accessed: 2026-11-09
  population: General public (US)
  key_finding: "Women start perimenopause at different ages; signs such as irregular periods often appear sometime in the 40s, but some notice changes as early as their 30s or as late as their 50s. Cycle length consistently different by 7 days or more suggests early perimenopause; 60 days or more between periods suggests late perimenopause. If periods are happening, pregnancy is still possible; use birth control until 12 months without a period. If any symptoms bother you, see your healthcare professional. Factors linked with earlier onset: smoking (menopause 1 to 2 years earlier), family history of early menopause, chemotherapy and pelvic radiation, hysterectomy, and some conditions such as thyroid disease, rheumatoid arthritis or other autoimmune diseases. Irregular periods are common and usually nothing to be concerned about; see a professional if bleeding is very heavy, lasts longer than seven days, happens between periods, or periods are usually less than 21 days apart; tell a professional about any bleeding after 12 months without a period."
  funding_conflict: null
  verified: true
  notes: Page dated Aug. 22, 2026.

- id: medlineplus-fatigue
  title: "Fatigue: MedlinePlus Medical Encyclopedia"
  authors: []
  publisher: MedlinePlus, US National Library of Medicine (NIH)
  year: 2025
  type: patient_information
  url: https://medlineplus.gov/ency/article/003088.htm
  doi: null
  accessed: 2026-11-08
  population: General public (US)
  key_finding: Causes of fatigue include an underactive or overactive thyroid; anemia, including iron deficiency anemia (iron deficiency can cause fatigue without anemia); sleep disorders such as insomnia, obstructive sleep apnea and narcolepsy; depression or grief; medicines such as sedatives, antidepressants, antihistamines, blood pressure medicines, sleeping pills, steroids and diuretics; alcohol or drug use; and conditions such as persistent pain, diabetes, heart failure, liver or kidney disease, infections and autoimmune disease. Home care includes enough sleep, a balanced diet with plenty of water, regular exercise, relaxation methods, a reasonable schedule and avoiding alcohol, nicotine and drugs; caffeine and other stimulants are not effective treatments for fatigue and sedatives tend to make it worse. Contact a provider right away for fatigue with confusion or dizziness, blurred vision, little or no urine, recent swelling and weight gain, or thoughts of self-harm or suicide.
  funding_conflict: null
  verified: true
  notes: Review date 5/19/2025. Page does not mention menopause or vitamin deficiencies.

- id: medlineplus-headache
  title: "Headache: MedlinePlus Medical Encyclopedia"
  authors: []
  publisher: MedlinePlus, US National Library of Medicine (NIH)
  year: 2025
  type: patient_information
  url: https://medlineplus.gov/ency/article/003024.htm
  doi: null
  accessed: 2026-11-08
  population: General public (US)
  key_finding: "Tension headache is the most common type, usually on both sides of the head, dull or squeezing, often with tight or sore shoulders, neck or jaw. Migraine pain is throbbing, pounding or pulsating, on one side of the head, often with vision changes, sensitivity to sound or light, or nausea, may follow an aura (warning symptoms before the headache), and gets worse with movement. Lack of sleep, caffeine withdrawal and alcohol can trigger migraine; sleep apnea is a rare cause of headache. Keep a headache diary (timing, food and drink, sleep, activity, duration). At the start of a migraine: drink water, rest in a quiet dark room, use a cool cloth and relaxation techniques. For tension headaches, acetaminophen, aspirin or ibuprofen may help. Check with a provider if taking pain medicine 3 or more days a week; frequent use can cause rebound (medicine overuse) headaches. Call 911 or go to the ER for a sudden, explosive or violent headache; seek care for the worst headache ever; a headache with slurred speech, vision changes, weakness or trouble moving limbs, loss of balance or confusion; a headache that worsens over 24 hours or comes with fever, stiff neck or vomiting; a headache after a head injury or with severe eye pain and redness; new headaches after age 50."
  funding_conflict: null
  verified: true
  notes: Review date 10/27/2025. Page does not mention menopause.

- id: medlineplus-itching
  title: "Itching: MedlinePlus Medical Encyclopedia"
  authors: []
  publisher: MedlinePlus, US National Library of Medicine (NIH)
  year: 2024
  type: patient_information
  url: https://medlineplus.gov/ency/article/003217.htm
  doi: null
  accessed: 2026-11-08
  population: General public (US)
  key_finding: Dry skin is a common cause of itching; aging skin is another. Generalized itching can come from liver disease with jaundice or kidney disease. Home care - do not scratch or rub; take lukewarm baths with little soap and rinse well; use moisturizer, especially in dry winter months; apply cold compresses; wear cool, light, loose bedclothes and avoid rough fabrics such as wool; avoid prolonged heat and humidity. Contact a provider for itching that is severe, does not go away, cannot be easily explained, keeps returning without a clear cause, or is all over the body, or comes with other unexplained symptoms.
  funding_conflict: null
  verified: true
  notes: Review date 8/5/2024. Page does not mention menopause or thyroid.

- id: medlineplus-dry-skin
  title: "Dry skin: MedlinePlus Medical Encyclopedia"
  authors: []
  publisher: MedlinePlus, US National Library of Medicine (NIH)
  year: 2024
  type: patient_information
  url: https://medlineplus.gov/ency/article/000835.htm
  doi: null
  accessed: 2026-11-08
  population: General public (US)
  key_finding: Causes include cold, dry winter air or hot, dry climates; dry indoor air from heating or cooling; bathing too often or too long; some soaps and detergents; skin conditions such as eczema or psoriasis; diseases such as diabetes and underactive thyroid; certain medicines; and aging, as skin gets thinner and makes less natural oil. Care includes moisturizers (creams or lotions with urea and lactic acid), limiting water exposure, lukewarm bath water, patting skin dry, and gentle cleansers free of dyes and perfumes.
  funding_conflict: null
  verified: true
  notes: Review date 10/13/2024. Page does not mention menopause.

- id: aad-skin-care-menopause
  title: Caring for your skin in menopause
  authors: []
  publisher: American Academy of Dermatology
  year: 2025
  type: patient_information
  url: https://www.aad.org/public/everyday-care/skin-care-secrets/anti-aging/skin-care-during-menopause
  doi: null
  accessed: 2026-11-08
  population: Women in menopause (US)
  key_finding: In menopause skin loses some ability to hold water and can get quite dry, especially in dry air. Wash with a mild cleanser instead of soap (skip deodorant bars); apply moisturizer after bathing and whenever skin feels dry (hyaluronic acid or glycerin can help); see a dermatologist if skin still feels dry. Around 50 the skin's pH changes, making skin more sensitive and rashes and irritation more likely; existing eczema or rosacea may worsen. Use a fragrance-free moisturizer and see a board-certified dermatologist if a rash lasts or a skin condition worsens.
  funding_conflict: null
  verified: true
  notes: Page last updated 11/24/2025.

- id: ripa-migraine-menopausal-women-review-2015
  title: "Migraine in menopausal women: a systematic review"
  authors:
    - Ripa P
    - Ornello R
    - Degan D
    - Tiseo C
    - Stewart J
    - Pistoia F
    - Carolei A
    - Sacco S
  publisher: International Journal of Women's Health
  year: 2015
  type: systematic_review
  url: https://pubmed.ncbi.nlm.nih.gov/26316824/
  doi: 10.2147/IJWH.S70073
  accessed: 2026-11-08
  population: Studies of migraine in perimenopausal and postmenopausal women (population-based and headache-center studies)
  key_finding: Population-based studies show migraine improving after menopause, with a possible increase in perimenopause; headache-center studies show no improvement or even worsening. Improvement is more likely after spontaneous than after surgical menopause. Postmenopausal hormone therapy was associated with migraine worsening in observational population-based studies; studies of specific regimens were inconclusive. No specific preventive measures are recommended for menopausal women with migraine.
  funding_conflict: null
  verified: true
  notes: Abstract read via NCBI E-utilities (PMID 26316824, PMC4548761).

