- id: jmir-online-menopause-information-2025
  title: "Understanding Experiences of and Unmet Needs in Online Searches for Menopause Information: An Exploratory Survey"
  authors: [Funnell EL, McConnell F, Martin-Key NA, Qian L, Babbitt K, et al.]
  publisher: JMIR Formative Research
  year: 2025
  type: other
  url: https://formative.jmir.org/2025/1/e75335
  doi: null
  accessed: "2026-11-06"
  population: 627 UK respondents (early perimenopause 171, late perimenopause 125, postmenopause 262, surgical menopause 69)
  key_finding: 92.7% had used the internet for menopause information. The most searched topics were symptoms (82.4%), treatment options (76.1%) and self-help (54.7%). Participants reported gaps in complete symptom lists, information for medical or surgical menopause, outdated content and lack of source transparency.
  funding_conflict: null
  verified: true
  notes: Cross-sectional online survey, UK-wide (the research plan did not say UK). Use for site planning, not for medical claims.

