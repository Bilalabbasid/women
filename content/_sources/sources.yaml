- id: cagnacci-contraception-over-40-consensus-2025
  title: Consensus conference results on contraception in women beyond 40 years of age
  authors:
    - Cagnacci A
    - Fruzzetti F
    - Bruni V
    - Gambera A
    - Guida M
    - Bonaccorsi G
    - Londero AP
  publisher: European Journal of Contraception and Reproductive Health Care
  year: 2025
  type: position_statement
  url: https://pubmed.ncbi.nlm.nih.gov/40838950/
  doi: 10.1080/13625187.2025.2544754
  accessed: 2026-11-07
  population: Women over 40 considering hormonal contraception during perimenopause
  key_finding: "Italian Society of Contraception multidisciplinary consensus panel
    (literature review to October 2024, statements voted at a national congress,
    consensus defined as >=75% agreement): 7 statements endorsed at 95-99%
    agreement. Cardiovascular safety is the primary factor in contraceptive
    selection; progestogen-only methods are considered safe for cardiovascular
    risk; combined hormonal contraceptives using natural estrogens or 20mcg
    ethynylestradiol with non-androgenic progestins are considered more
    advantageous for cardiovascular risk. LNG-IUD, estradiol valerate/dienogest,
    and the combined vaginal ring are identified as most effective for menstrual
    bleeding management. Hormone type and route of administration can influence
    sexual function, with implants and vaginal rings showing positive effects.
    Combined hormonal contraceptives show protective effects on bone density;
    progestogen-only methods are neutral."
  funding_conflict: null
  verified: true
  notes: Expert consensus/position statement, not a systematic review of trial
    data - reflects panel judgment on existing evidence, graded accordingly.
