  url: https://www.nidcd.nih.gov/health/sudden-deafness
  doi: null
  accessed: 2026-11-11
  population: General public (US)
  key_finding: Sudden sensorineural hearing loss is an unexplained, rapid loss of hearing all at once or over a few days, frequently in one ear; it may come with ear fullness, dizziness or ringing in the ears. Consider it a medical emergency and see a doctor immediately; delaying diagnosis and treatment can decrease treatment effectiveness. It most often affects adults in their late 40s and early 50s. Steroid treatment works best given as soon as possible; treatment delayed more than 2 to 4 weeks is less likely to help.
  funding_conflict: null
  verified: true
  notes: Opened 2026-11-11. Last updated September 14, 2018.

- id: nhs-tinnitus
  title: Tinnitus
  authors: []
  publisher: NHS (nhs.uk)
  year: 2024
  type: patient_information
  url: https://www.nhs.uk/conditions/tinnitus/
  doi: null
  accessed: 2026-11-11
  population: General public (UK)
  key_finding: Tinnitus is hearing noises that do not come from an outside source; not usually a sign of anything serious and may get better by itself. Often linked to hearing loss, Meniere's disease, diabetes, thyroid disorders, multiple sclerosis, anxiety or depression, and some medicines (some chemotherapy medicines, antibiotics, NSAIDs, aspirin). See a GP if tinnitus is regular or constant, getting worse, or bothering you (sleep, concentration, anxiety). Ask for an urgent GP appointment if it beats in time with your pulse. Go to A&E or call 999 for tinnitus after a head injury, or with sudden hearing loss, weakness in the face muscles or vertigo. The GP checks the ears (infection, earwax) and hearing and may refer to a specialist. Self-help - relax (deep breathing, yoga), improve sleep (bedtime routine, less caffeine), avoid stress and loud background noise, avoid total silence (soft music or sounds), don't focus on it, support groups. Treatments - CBT (digital CBT usually offered first), tinnitus counselling, tinnitus retraining therapy (may be on the NHS for severe or persistent tinnitus; unclear if it works for everyone); hearing aids if there is hearing loss.
  funding_conflict: null
  verified: true
  notes: Opened 2026-11-11. Page last reviewed 12 January 2024. UK guidance; use only in a labeled UK line. Page does not mention menopause.

