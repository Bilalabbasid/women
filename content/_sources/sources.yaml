- id: korn-bernstein-migraine-menopause-2026
  title: "Migraine across the menopausal transition and beyond: A narrative review"
  authors:
    - Korn TF
    - Bernstein C
  publisher: Headache
  year: 2026
  type: other
  url: https://pubmed.ncbi.nlm.nih.gov/41934093/
  doi: 10.1111/head.70071
  accessed: 2026-11-06
  population: Perimenopausal and postmenopausal women with migraine
  key_finding: Unstable estradiol and progesterone during perimenopause can worsen
    migraine frequency. Migraine without aura often improves after menopause;
    migraine with aura tends to persist and independently raises ischemic stroke
    risk. Oral estrogen, especially at higher doses, may worsen migraine and
    raise vascular risk, particularly with aura; low-dose transdermal estrogen
