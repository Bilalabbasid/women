- id: straw-10-2012
  title: "Executive summary of the Stages of Reproductive Aging Workshop + 10:
    addressing the unfinished agenda of staging reproductive aging"
  authors:
    - Harlow SD
    - Gass M
    - Hall JE
    - Lobo R
    - Maki P
    - et al.
  publisher: Fertility and Sterility (published jointly in several journals)
  year: 2012
  type: guideline
  url: https://www.fertstert.org/article/S0015-0282(12)00187-2/abstract
  doi: null
  accessed: 2026-11-06
  population: Midlife women (cohort data from five countries)
  key_finding: Early menopausal transition is a persistent difference of 7 days or
    more in the length of consecutive cycles (recurring within 10 cycles). Late
    transition is 60 days or more without a period, and lasts on average 1 to 3
    years. "Perimenopause" begins at the early transition and ends 12 months
    after the final menstrual period.
  funding_conflict: null
  verified: true
  notes: Consensus staging system for research and clinical use. Bleeding criteria
    do not apply after hysterectomy or with hormonal contraception (route these
    to tailored guidance in the stage tool).
