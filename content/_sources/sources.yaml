  type: position_statement
  url: https://pubmed.ncbi.nlm.nih.gov/40907339/
  doi: 10.1016/j.maturitas.2025.108715
  accessed: 2026-11-07
  population: Women with a history of endometriosis, peri- or postmenopausal
  key_finding: Endometriosis or its treatment may cause spontaneous
    early/premature or surgically induced menopause, and is associated with
    increased risk of cardiovascular disease, ovarian/breast/thyroid cancer, and
    osteoporosis. Continuous combined MHT may be safer than other forms
    (including after hysterectomy) since it may reduce the risk of recurrence or
    malignant transformation of residual endometriosis tissue; estrogen-only MHT
    should be avoided even after hysterectomy in this group. Neurokinin-3
    receptor antagonists are a non-hormonal alternative for vasomotor symptoms;
    antiresorptive/anabolic therapy plus calcium and vitamin D for bone
    protection. Surgery is preferred for symptomatic postmenopausal
    endometriosis. Herbal preparations are advised against (uncertain efficacy,
    some contain estrogenic compounds).
