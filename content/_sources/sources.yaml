  population: U.S. women in perimenopause and menopause
  key_finding: "The FDA has approved hormone therapies for moderate to severe hot flashes, preventing bone loss and osteoporosis, and vaginal dryness. With a uterus, a progestogen is needed with estrogen. The FDA has approved three nonhormone medicines for moderate to severe hot flashes: low-dose paroxetine, fezolinetant and elinzanetant; fezolinetant has an FDA warning about rare, serious liver injury. SSRIs, SNRIs and gabapentin may be suggested but are not FDA-approved for this use. CBT and clinical hypnosis are options that do not use medicine and can reduce how much hot flashes bother you."
  funding_conflict: null
  verified: true
