  key_finding: "Frozen shoulder most commonly affects people between 40 and 60 and occurs in women more often than men. It is much more common in people with diabetes (reason unknown), and is associated with hypothyroidism, hyperthyroidism, Parkinson's disease and cardiac disease; it can follow immobilization after surgery, fracture or injury. Stages: freezing (pain worsens, motion lost; about 6 weeks to 9 months), frozen (pain may improve, stiffness remains; 4 to 6 months), thawing (motion slowly improves; about 6 months to 2 years). It generally gets better over time without surgery, although it may take up to 3 years. Physical therapy focused on shoulder flexibility is the primary treatment recommendation; also NSAIDs, cortisone injections, hydrodilatation if other nonsurgical methods fail, and surgery (manipulation under anesthesia, arthroscopic capsular release) if conservative treatment does not help. Improving diabetes control can help recovery."
