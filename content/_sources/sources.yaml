- id: nih-ods-black-cohosh-2020
  title: "Black Cohosh: Fact Sheet for Health Professionals"
  authors: []
  publisher: National Institutes of Health, Office of Dietary Supplements
  year: 2020
  type: other
  url: https://ods.od.nih.gov/factsheets/BlackCohosh-HealthProfessional/
  doi: null
  accessed: 2026-11-08
  population: Perimenopausal and postmenopausal women using black cohosh for
    menopausal symptoms
  key_finding: "Preparations vary considerably in chemical composition and the
    active ingredients are unknown. Two high-quality RCTs (351 and 88 women; 160
    mg/day and 128 mg/day extract) found no difference from placebo for hot
    flashes and night sweats; a 2012 Cochrane review of 16 RCTs (2,027 women,
    8-160 mg/day, median 40 mg/day) found insufficient evidence to support or
    oppose use. Side effects in trials were usually mild GI upset and rash; most
    studies lasted 6 months or less, so long-term safety is unstudied. At least
    83 reported cases of liver damage worldwide (no proven causal link). USP
    (2008) recommends a label: stop use and consult a healthcare practitioner if
    you have a liver disorder or develop abdominal pain, dark urine or jaundice;
    FDA does not require this warning. People with liver disorders should avoid
    it; pregnant women should not take it except under supervision. No known
    clinically relevant drug interactions, though not systematically studied."
  funding_conflict: null
  verified: true
  notes: "Page says 'Updated: June 3, 2020'. Read in full via a page-to-markdown
    fetcher (direct curl gets 403 per earlier research notes). The liver section
    says 'there is no evidence of a causal relationship'; some cases may reflect
    impurities, adulterants or the wrong Actaea species. Australia has required
    a liver warning label since 2007."
- id: nih-ods-magnesium-2026
  title: "Magnesium: Fact Sheet for Health Professionals"
  authors: []
  publisher: National Institutes of Health, Office of Dietary Supplements
  year: 2026
  type: other
  url: https://ods.od.nih.gov/factsheets/Magnesium-HealthProfessional/
  doi: null
  accessed: 2026-11-08
  population: Healthy adults and people at risk of magnesium inadequacy (US)
  key_finding: "RDA for women 51+ is 320 mg/day. Tolerable Upper Intake Level for
    supplemental magnesium (supplements and medicines, not food) is 350 mg/day
    for adults. Forms that dissolve well in liquid are more completely absorbed;
    small studies found aspartate, citrate, lactate and chloride more
    bioavailable than oxide and sulfate. Supplement labels list elemental
    magnesium. High supplemental doses often cause diarrhea, nausea and
    abdominal cramping (most often carbonate, chloride, gluconate, oxide).
    Toxicity (hypotension, nausea, vomiting, facial flushing, urine retention,
    lethargy, muscle weakness, difficulty breathing, irregular heartbeat,
    cardiac arrest) is more likely with impaired kidney function. Interactions:
    oral bisphosphonates (separate by at least 2 hours); tetracycline and
    quinolone antibiotics (take the antibiotic at least 2 hours before or 4-6
    hours after magnesium); loop and thiazide diuretics and long-term PPIs can
    lower magnesium. Good food sources: green leafy vegetables, legumes, nuts,
    seeds, whole grains."
  funding_conflict: null
  verified: true
  notes: "Page says 'Updated: January 6, 2026'. Read in full via a
    page-to-markdown fetcher. The fact sheet does not discuss sleep, insomnia,
    anxiety or hot flashes, and gives no absorption percentage for magnesium
    oxide. Food table: pumpkin seeds 156 mg/oz, chia 111 mg/oz, almonds 80
    mg/oz, boiled spinach 78 mg per half cup."
