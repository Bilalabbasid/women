- id: owh-menopause-and-your-health-2026
  title: Menopause and your health
  authors: []
  publisher: Office on Women's Health, U.S. Department of Health and Human Services
  year: 2026
  type: patient_information
  url: https://womenshealth.gov/menopause/menopause-and-your-health
  doi: null
  accessed: 2026-11-11
  population: U.S. women after menopause
  key_finding: Lower estrogen after menopause can affect bones, heart and bladder. You lose bone faster after menopause, raising the risk of osteoporosis and broken bones; the risk of heart disease rises after menopause; low estrogen can cause urinary urgency and other bladder symptoms as part of genitourinary syndrome of menopause (GSM), and makes repeat UTIs more likely. Hormone therapy helps prevent bone loss but is not recommended to prevent heart disease or stroke. Being active, not smoking and getting enough calcium from food help; many women gain weight around menopause, and regular exercise can help reduce weight and waist size.
  funding_conflict: null
  verified: true
  notes: Page last updated October 19, 2026. Read in full via Firecrawl on 2026-11-11.

