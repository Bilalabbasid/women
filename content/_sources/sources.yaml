    long-term safety is not known. Common mild side effects: stomach upset,
    loose stools, nausea, drowsiness. Case reports link it to acute liver injury
    (signs included jaundice, pruritus, nausea, lethargy, abdominal discomfort,
    hyperbilirubinemia; people improved after stopping; product contents not
    always verified). It may raise thyroid hormone levels; three case reports of
    thyrotoxicosis; might interact with thyroid hormone medications, and also
    antidiabetes medications, antihypertensives, immunosuppressants and
    sedatives. Some experts advise against use in pregnancy; ANSES (2024)
