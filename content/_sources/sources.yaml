- id: lovejoy-visceral-fat-menopause-2008
  title: Increased visceral fat and decreased energy expenditure during the
    menopausal transition
  authors:
    - Lovejoy JC
    - Champagne CM
    - de Jonge L
    - Xie H
    - Smith SR
  publisher: International Journal of Obesity
  year: 2008
  type: cohort
  url: https://pubmed.ncbi.nlm.nih.gov/18332882/
  doi: 10.1038/ijo.2008.25
  accessed: 2026-11-08
  population: 156 healthy, initially premenopausal women (103 Caucasian, 53
    African-American) measured yearly for 4 years (DEXA, CT, accelerometry;
    calorimetry in a subset of 34)
  key_finding: Body fat and weight increased significantly only in women who
    became postmenopausal by year 4 (n=51). All women gained subcutaneous
    abdominal fat with age, but only those who became postmenopausal had a
    significant increase in visceral fat. Physical activity fell significantly 2
    years before menopause and stayed low. Sleeping energy expenditure fell
    1.5-fold more in women who became postmenopausal (-7.9% vs -5.3%), and fat
    oxidation fell 32% in that group. Authors conclude menopause onset is
    associated with lower energy expenditure and fat oxidation that can
    predispose to obesity if lifestyle changes are not made.
  funding_conflict: null
  verified: true
  notes: Abstract read via NCBI E-utilities efetch. Small single-center cohort
    (Pennington Biomedical); funding and disclosures not checked.
- id: davis-ims-weight-gain-menopause-2012
  title: Understanding weight gain at menopause
  authors:
    - Davis SR
    - Castelo-Branco C
    - Chedraui P
    - Lumsden MA
    - Nappi RE
    - Shah D
    - Villaseca P
  publisher: Climacteric (International Menopause Society, World Menopause Day
    2012 writing group)
  year: 2012
  type: other
  url: https://pubmed.ncbi.nlm.nih.gov/22978257/
  doi: 10.3109/13697137.2012.707385
  accessed: 2026-11-08
  population: Literature review of studies on menopause, midlife, body weight and
    body composition
  key_finding: Weight gain per se cannot be attributed to the menopause
    transition, but the hormonal change at menopause is associated with an
    increase in total body fat and in abdominal fat. Weight excess at midlife is
    associated with higher risk of cardiovascular and metabolic disease and
    affects quality of life and sexual function. Studies mostly show less
    overall fat mass with estrogen or estrogen-progestin therapy, but further
    studies are needed to identify which women benefit before evidence-based
    clinical recommendations can be made.
  funding_conflict: null
  verified: true
  notes: Abstract read via NCBI E-utilities efetch. Narrative review, not a
    systematic review, so typed 'other'. Author disclosures not checked.
- id: chlebowski-whi-estrogen-joint-symptoms-2013
  title: Estrogen alone and joint symptoms in the Women's Health Initiative
    randomized trial
  authors:
    - Chlebowski RT
    - Cirillo DJ
    - Eaton CB
    - Stefanick ML
    - Pettinger M
    - Carbone LD
    - Johnson KC
    - Simon MS
    - Woods NF
    - Wactawski-Wende J
  publisher: Menopause
  year: 2013
  type: rct
  url: https://pubmed.ncbi.nlm.nih.gov/23511705/
  doi: 10.1097/GME.0b013e31828392c4
  accessed: 2026-11-08
  population: 10,739 postmenopausal women who had had a hysterectomy, randomized
    to daily oral conjugated equine estrogens 0.625 mg or placebo (US)
  key_finding: Post hoc analysis. At entry about 77% reported joint pain and 40%
    joint swelling. After 1 year joint pain frequency was lower with estrogen
    alone than placebo (76.3% vs 79.2%, P = 0.001), as was severity, and the
    difference persisted through year 3. Joint swelling was more frequent with
    estrogen (42.1% vs 39.7%, P = 0.02). Authors conclude estrogen alone gives a
    modest but sustained reduction in joint pain frequency.
  funding_conflict: null
  verified: true
  notes: Abstract read via NCBI E-utilities efetch. Republished in Menopause
    2018;25(11):1313-1320 (PMID 30358728). Post hoc; estrogen-alone arm only;
    years 3 and 6 assessed in a 9.9% subsample.
- id: nhs-menopause-symptoms
  title: Symptoms of menopause and perimenopause
  authors: []
  publisher: NHS (nhs.uk)
  year: 2026
  type: patient_information
  url: https://www.nhs.uk/conditions/menopause/symptoms/
  doi: null
  accessed: 2026-11-08
  population: General public (UK)
  key_finding: Periods may happen more often or less often, and bleeding may get
    heavier or lighter. Other symptoms include hot flushes and night sweats,
    trouble getting to sleep or staying asleep, mood swings, low mood or
    depression, problems with memory or concentration, palpitations, headaches
    and migraines worse than usual, muscle aches and joint pains, vaginal
    dryness, more UTIs and reduced sex drive. Contact a GP if you think you have
    symptoms and want to know your options, have palpitations, are bleeding more
    (not less) than before, or have any bleeding after 12 months without a
    period.
  funding_conflict: null
  verified: true
  notes: Last reviewed 19 May 2026. The page does not give an age threshold (such
    as under 45) in its GP advice.
- id: nhs-joint-pain
  title: Joint pain
  authors: []
  publisher: NHS (nhs.uk)
  year: 2026
  type: patient_information
  url: https://www.nhs.uk/conditions/joint-pain/
  doi: null
  accessed: 2026-11-08
  population: General public (UK)
  key_finding: See a GP if pain or swelling is getting worse or keeps coming back,
    has not improved after 2 weeks of home treatment, disrupts daily life or
    sleep, or joints are stiff for more than 30 minutes after waking. Urgent GP
    appointment or NHS 111 if the skin around a painful joint is swollen and
    hot, or if joint pain comes with feeling unwell, a high temperature or
    feeling hot, cold or shivery. A&E or 999 for very bad joint pain after a
    fall or injury, being unable to walk or put weight on a joint, a joint that
    has moved out of place, or tingling or no feeling around a joint after an
    injury.
  funding_conflict: null
  verified: true
  notes: Last reviewed 26 February 2026. Also has a symptom-to-cause table
    (osteoarthritis, rheumatoid arthritis, bursitis, gout, septic arthritis,
    sprains).
