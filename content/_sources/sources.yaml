- id: young-menopause-sleep-disordered-breathing-2003
  title: Menopausal status and sleep-disordered breathing in the Wisconsin Sleep
    Cohort Study
  authors:
    - Young T
    - Finn L
    - Austin D
    - Peterson A
  publisher: American Journal of Respiratory and Critical Care Medicine
  year: 2003
  type: cohort
  url: https://pubmed.ncbi.nlm.nih.gov/12615621/
  doi: 10.1164/rccm.200209-1055OC
  accessed: 2026-11-08
  population: 589 women in the population-based Wisconsin Sleep Cohort Study (US),
    with in-laboratory polysomnography
  key_finding: Adjusted for age, body habitus, smoking and other confounders, odds
    ratios for 5 or more apnea/hypopnea events per hour were 1.2 (0.7-2.2) in
    perimenopause and 2.6 (1.4-4.8) in postmenopause versus premenopause; for 15
    or more events per hour, 1.1 (0.5-2.2) and 3.5 (1.4-8.8). The authors
    conclude that evaluation for sleep-disordered breathing should be a priority
    for menopausal women with complaints of snoring, daytime sleepiness or
    unsatisfactory sleep.
  funding_conflict: null
  verified: true
  notes: Read via PubMed abstract (NCBI E-utilities). Cross-sectional analysis of
    a cohort; the perimenopause result was not significant.
- id: baker-sleep-menopausal-transition-review-2018
  title: "Sleep problems during the menopausal transition: prevalence, impact, and
    management challenges"
  authors:
    - Baker FC
    - de Zambotti M
    - Colrain IM
    - Bei B
  publisher: Nature and Science of Sleep
  year: 2018
  type: other
  url: https://pubmed.ncbi.nlm.nih.gov/29445307/
  doi: 10.2147/NSS.S125807
  accessed: 2026-11-08
  population: Women in the menopausal transition and postmenopause (narrative review)
  key_finding: "26% of women in the approach to menopause and beyond have severe
    sleep symptoms that affect daytime functioning. Longitudinal studies link
    sleep difficulties with menopausal stage and changes in FSH and estradiol,
    beyond age. Many, though not all, hot flashes are linked with
    polysomnographic awakenings. Agreement between self-reported and objectively
    measured hot flashes is particularly low at night because of
    under-reporting. SWAN: women with moderate-to-severe hot flashes were almost
    three times more likely to report frequent night-time awakenings. Some sleep
    complaints are linked with depression or with sleep-related breathing and
    movement disorders, which increase in prevalence especially after menopause;
    stress, rumination and anxiety overlap with menopause-related insomnia.
    Limited data suggest an advanced circadian phase could contribute to
    fragmented sleep or early-morning awakening in postmenopausal women. CBT for
    insomnia should be considered for women with insomnia in the menopausal
    transition."
  funding_conflict: Authors report no conflicts of interest.
  verified: true
  notes: Narrative review, so typed 'other'. Abstract read via NCBI E-utilities;
    full text read from PMC5810528.
- id: de-zambotti-hot-flashes-sleep-2014
  title: Magnitude of the impact of hot flashes on sleep in perimenopausal women
  authors:
    - de Zambotti M
    - Colrain IM
    - Javitz HS
    - Baker FC
  publisher: Fertility and Sterility
  year: 2014
  type: small_study
  url: https://pubmed.ncbi.nlm.nih.gov/25256933/
  doi: 10.1016/j.fertnstert.2014.08.016
  accessed: 2026-11-08
  population: 34 perimenopausal women (mean age 50.4) studied over 63 laboratory
    nights with polysomnography and sternal skin-conductance recording
  key_finding: Women had an average of 3.5 objectively recorded hot flashes per
    night; 69.4% of hot flashes were associated with an awakening. Hot
    flash-associated time awake averaged 16.6 minutes a night, accounting for
    27.2% of total awake time. The presence of physiological hot flashes
    accounts for a significant proportion of total objective night-time
    wakefulness.
  funding_conflict: One author (Colrain) reports grants with Apnicure Inc.
  verified: true
  notes: Small cross-sectional sleep-lab study; weight it accordingly. Abstract
    read via NCBI E-utilities.
- id: nimh-generalized-anxiety-disorder
  title: "Generalized Anxiety Disorder: When Worry Gets Out of Control"
  authors: []
  publisher: National Institute of Mental Health (NIH)
  year: 2025
  type: patient_information
  url: https://www.nimh.nih.gov/health/publications/generalized-anxiety-disorder-gad
  doi: null
  accessed: 2026-11-08
  population: General public (US)
  key_finding: "Lists GAD symptoms (excessive worry, feeling on edge or irritable,
    restlessness, trouble concentrating, trouble sleeping or fatigue, headaches,
    muscle aches, stomachaches or tension). A health care provider may do a
    physical exam to make sure an unrelated physical problem is not causing the
    symptoms. Treatment usually involves psychotherapy, medication or both; CBT
    is described as the well-studied 'gold standard' psychotherapy. Medications
    include SSRIs and SNRIs (which can take several weeks to work and may cause
    headaches, nausea or difficulty sleeping), benzodiazepines (tolerance and
    dependence possible, so often prescribed only briefly) and buspirone (3-4
    weeks to be fully effective). Gives crisis guidance: call or text 988; in
    life-threatening situations, call 911."
  funding_conflict: null
  verified: true
  notes: "NIMH publication, revised 2025. Not menopause-specific: use for general
    anxiety treatment facts and US crisis numbers."
