- id: swan-vms-duration-avis-2015
  title: "Duration of menopausal vasomotor symptoms over the menopause transition"
  authors: [Avis NE, Crawford SL, Greendale G, Bromberger JT, Everson-Rose SA, Gold EB, Hess R, Joffe H, Kravitz HM, Tepper PG, Thurston RC]
  publisher: JAMA Internal Medicine
  year: 2015
  type: cohort
  url: https://pubmed.ncbi.nlm.nih.gov/25686030/
  doi: 10.1001/jamainternmed.2014.8063
  accessed: "2026-11-06"
  population: "SWAN (Study of Women's Health Across the Nation): 3,302 multiracial/multiethnic US women at 7 sites, Feb 1996-Apr 2013, median 13 visits; 1,449 women with frequent VMS analyzed"
  key_finding: "Median total duration of frequent vasomotor symptoms (hot flashes or night sweats, 6 or more days in the prior 2 weeks) was 7.4 years. Among 881 women with an observable final menstrual period (FMP), median persistence after the FMP was 4.5 years. Women premenopausal or early-perimenopausal when frequent VMS first began had the longest duration (median over 11.8 years) and longest post-FMP persistence (median 9.4 years); those postmenopausal at VMS onset had the shortest (median 3.4 years). African American women had the longest median duration (10.1 years) of any racial or ethnic group studied. Younger age, lower education, greater perceived stress and symptom sensitivity, and higher depressive and anxiety symptoms at first VMS report were linked to longer duration."
  funding_conflict: null
  verified: true

- id: appiah-menopause-age-trends-2021
  title: "Trends in Age at Natural Menopause and Reproductive Life Span Among US Women, 1959-2018"
  authors: [Appiah D, Nwabuo CC, Ebong IA, Wellons MF, Winters SJ]
  publisher: JAMA
  year: 2021
  type: cohort
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8025101/
  doi: 10.1001/jama.2021.0278
  accessed: "2026-11-06"
  population: "US women aged 40-74 with natural menopause, NHANES/NHES surveys 1959-1962 through 2015-2018 (analytic sample of 7,773)"
  key_finding: "Mean age at natural menopause rose from 48.4 to 49.9 years between 1959-1962 and 2015-2018 (p<.001 for trend); mean reproductive life span rose from 35.0 to 37.1 years; mean age at menarche fell from 13.5 to 12.7 years. Early menopause (natural menopause at age 40-45) was reported by 11.8% of women in 2015-2018. Black and Hispanic race-ethnicity, poverty, smoking, and hormone therapy use were associated with earlier menopause and shorter reproductive span in adjusted models; higher education and oral contraceptive use were associated with longer spans."
  funding_conflict: null
  verified: true
  notes: "NCBI's indexed abstract for this JAMA research letter is a one-line teaser only, with no numbers, and the publisher blocks full-text retrieval through the E-utilities API. The specific figures above come from the Blog/SEO session's own read of the full text, not from anything independently pulled via API here. Independently confirmed here: title, authors, journal, year, DOI, PMCID, and that this is a real NHANES-based research letter."

- id: acog-compounded-bioidentical-2023
