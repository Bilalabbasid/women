  key_finding: "Compounding pharmacies market 'bioidentical hormone' preparations as natural, safer, and more effective than FDA-approved menopausal hormone therapy, but evidence to support those safety and effectiveness claims is lacking. ACOG recommends against routinely prescribing compounded bioidentical MHT when FDA-approved formulations exist; clinicians should counsel patients who request it anyway on the lack of FDA approval and the risks specific to compounding (no standardized testing for purity, potency, or sterility). High-quality randomized controlled trials comparing compounded with FDA-approved MHT are still needed."
