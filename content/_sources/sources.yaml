  key_finding: "Pooled meta-analysis of 5 trials of Promensil (a red clover extract) found no significant difference vs. placebo in hot flush frequency (mean difference -0.93, 95% CI -1.95 to 0.10). Authors' conclusion: no conclusive evidence shows phytoestrogen supplements effectively reduce the frequency or severity of hot flushes and night sweats, though high-genistein extracts (over 30mg/day) in 4 unpooled trials showed more consistent reduction and should be further investigated. A strong placebo effect was noted (1-59% reduction with placebo). No evidence of estrogenic stimulation of the endometrium or vagina, or other adverse effects, up to 2 years."
