    proportion of women at intermediate-to-high CV risk nearly doubling between
    ages 51 and 55. 'Timing hypothesis': HRT started within 10 years of
    menopause onset or before age 60 may confer cardiovascular benefit; later
    initiation may increase risk. The modern approach emphasizes individualized
    selection, lower-dose regimens, and transdermal delivery. Significant
    uncertainties persist due to trial heterogeneity and underrepresentation of
    diverse populations."
