  key_finding: "Narrative review proposing estrogen's modulatory role in neurosensory function, including the vestibular system, as a plausible mechanism linking the menopausal hormonal decline to increased vertigo symptoms. Describes this as a developing research area with clinical implications for diagnosis and treatment of postmenopausal vestibular disorders."
  funding_conflict: null
  verified: true
  notes: "Narrative review, not a primary study — typed 'other'. The abstract itself doesn't name vestibular migraine as a specific overlapping diagnosis; that detail (if used in the article) should be attributed to the full text, not this abstract-level entry."

- id: reinke-frozen-shoulder-hrt-2026
  title: "A preliminary pilot study to address design issues related to research on potential association of hormone therapy and adhesive capsulitis"
  authors: [Reinke EK, Ford AC, Wahl E, Kennedy J, Poehlein E, Green CL, Saltzman E, Wittstein JR]
  publisher: Climacteric
  year: 2026
