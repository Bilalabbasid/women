  population: Women with genitourinary syndrome of menopause
  key_finding: Over-the-counter vaginal moisturisers used several times per week provide continuous tissue hydration, whereas lubricants reduce friction specifically during sexual activity. Both are recommended as first-line therapy before or alongside prescription options.
