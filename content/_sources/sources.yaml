- id: straw-10-2012
  title: "Executive summary of the Stages of Reproductive Aging Workshop + 10: addressing the unfinished agenda of staging reproductive aging"
  authors: [Harlow SD, Gass M, Hall JE, Lobo R, Maki P, et al.]
  publisher: Fertility and Sterility (published jointly in several journals)
  year: 2012
  type: guideline
  url: https://www.fertstert.org/article/S0015-0282(12)00187-2/abstract
  doi: null
  accessed: "2026-11-06"
  population: Midlife women (cohort data from five countries)
  key_finding: Early menopausal transition is a persistent difference of 7 days or more in the length of consecutive cycles (recurring within 10 cycles). Late transition is 60 days or more without a period, and lasts on average 1 to 3 years. "Perimenopause" begins at the early transition and ends 12 months after the final menstrual period.
  funding_conflict: null
  verified: true
  notes: Consensus staging system for research and clinical use. Bleeding criteria do not apply after hysterectomy or with hormonal contraception (route these to tailored guidance in the stage tool).

- id: nice-ng23
  title: "Menopause: identification and management (NG23)"
  authors: []
  publisher: National Institute for Health and Care Excellence (UK)
  year: 2026
  type: guideline
  url: https://www.nice.org.uk/guidance/ng23
  doi: null
  accessed: "2026-11-06"
  population: Women, trans men and non-binary people registered female at birth with menopause-associated symptoms (UK)
  key_finding: UK guideline on identifying perimenopause and menopause, managing symptoms in people aged 40 and over, the effects of HRT on specific health outcomes, premature ovarian insufficiency under 40, and starting, stopping and reviewing HRT. Last reviewed 15 April 2026, when advice on vaginal bleeding while taking systemic HRT was amended.
  funding_conflict: null
  verified: true
  notes: Overview page only. Open the specific recommendation before citing it.

- id: nice-ng23-recommendations
  title: "Menopause: identification and management (NG23), Recommendations"
  authors: []
  publisher: National Institute for Health and Care Excellence (UK)
  year: 2026
  type: guideline
  url: https://www.nice.org.uk/guidance/ng23/chapter/Recommendations
  doi: null
  accessed: "2026-11-06"
  population: Women, trans men and non-binary people registered female at birth with menopause-associated symptoms (UK)
  key_finding: "1.2.2: besides changes in the menstrual cycle, symptoms may include vasomotor symptoms (hot flushes and sweats), genitourinary symptoms (for example vaginal dryness), effects on mood (for example depressive symptoms), musculoskeletal symptoms (for example joint and muscle pain) and sexual difficulties (for example low sexual desire), varying from minor to severe and over short or long periods. 1.3.1: in otherwise healthy people aged 45 or over, identify perimenopause without laboratory tests if vasomotor symptoms have recently started with any change in the menstrual cycle; menopause after 12 months without a period when not using hormonal contraception. 1.3.4: do not use AMH, inhibin A or B, oestradiol, antral follicle count or ovarian volume to identify perimenopause or menopause at 45 or over."
  funding_conflict: null
  verified: true
  notes: Published 12 November 2015, last updated 15 April 2026. UK guidance; check US guidance before applying to US readers.

# ---------------------------------------------------------------- Studies and surveys

- id: jmir-online-menopause-information-2025
  title: "Understanding Experiences of and Unmet Needs in Online Searches for Menopause Information: An Exploratory Survey"
  authors: [Funnell EL, McConnell F, Martin-Key NA, Qian L, Babbitt K, et al.]
  publisher: JMIR Formative Research
  year: 2025
  type: other
  url: https://formative.jmir.org/2025/1/e75335
  doi: null
  accessed: "2026-11-06"
  population: 627 UK respondents (early perimenopause 171, late perimenopause 125, postmenopause 262, surgical menopause 69)
  key_finding: 92.7% had used the internet for menopause information. The most searched topics were symptoms (82.4%), treatment options (76.1%) and self-help (54.7%). Participants reported gaps in complete symptom lists, information for medical or surgical menopause, outdated content and lack of source transparency.
  funding_conflict: null
  verified: true
  notes: Cross-sectional online survey, UK-wide (the research plan did not say UK). Use for site planning, not for medical claims.

