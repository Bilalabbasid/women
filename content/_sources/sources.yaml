    than normal for 3 or more cycles, bleed after menopause, between periods or
    after sex, bleeding becomes heavy enough to cause weakness or
    lightheadedness, or you have fever or lower abdominal pain. Causes of
    abnormal uterine bleeding include irregular or absent ovulation (more common
    approaching menopause), fibroids, polyps, adenomyosis, thyroid or pituitary
