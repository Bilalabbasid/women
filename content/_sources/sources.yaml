- id: nidcd-tinnitus
  title: Tinnitus
  authors: []
  publisher: National Institute on Deafness and Other Communication Disorders (NIDCD), NIH
  year: 2023
  type: patient_information
  url: https://www.nidcd.nih.gov/health/tinnitus
  doi: null
  accessed: 2026-11-11
  population: General public (US)
  key_finding: Tinnitus is sound with no outside source; surveys estimate 10 to 25% of adults have it. It may improve or go away over time but sometimes worsens; lasting 3 months or longer counts as chronic. Most people with tinnitus have some hearing loss. It is only rarely linked to a serious medical problem, but can affect mood, sleep and concentration, and in severe cases lead to anxiety or depression. Linked causes - noise exposure, hearing loss (aging, noise), medicines (NSAIDs such as ibuprofen, naproxen and aspirin; certain antibiotics; anti-cancer drugs; anti-malaria drugs; antidepressants), earwax or ear infection, head or neck injury; less common - Meniere's disease (with balance problems and hearing loss), jaw joint problems, tumors such as acoustic neuroma, blood vessel problems including high blood pressure, and chronic conditions such as diabetes, migraines, thyroid disorders and anemia. Rarely the sound pulses in time with the heartbeat (often an identifiable, treatable cause); an ENT may order imaging especially if tinnitus pulsates. First see a primary care doctor (checks earwax, infection, medicines), who may refer to an ENT and an audiologist. Treating an underlying cause such as earwax or jaw problems can eliminate or greatly reduce it. Treatments - sound therapy (tabletop or smartphone sound generators, a fan; hearing aids are a main option for people with hearing loss; wearable sound generators), counseling and education, cognitive behavioral therapy (studies show it can improve well-being), tinnitus retraining therapy. No FDA-approved medicine for tinnitus; antidepressants or anti-anxiety medicines may be prescribed for mood or sleep; vitamins, herbal extracts and supplements advertised for tinnitus have not been proven effective.
  funding_conflict: null
  verified: true
  notes: Opened 2026-11-11. Last updated May 1, 2023. Page does not mention menopause. Page says there is no cure; site copy rules ban that word, so paraphrase.

- id: nidcd-sudden-deafness
  title: Sudden Deafness
  authors: []
