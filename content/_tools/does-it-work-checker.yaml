# Tool logic: Does it work? Evidence checker.
# Clinician review covers this description AND the code files listed under `code`.

id: does-it-work-checker
name: "Does it work? Evidence checker"
guide_url: /tools/does-it-work-checker/
app_paths: []

status: draft
reviewer: null
reviewed_at: null
approved_hash: null

code:
  - src/components/tools/does-it-work-checker.tsx
  - src/lib/safety/urgent-triggers.ts

purpose: >-
  An interactive lookup tool that lets readers filter hormonal, non-hormonal
  prescription, behavioral, topical, and over-the-counter options by symptom and
  evidence grade, and save a shortlist to discuss with a clinician.

inputs:
  - Symptom or health goal filter
  - Evidence grade filter (strong, moderate, limited, not_supported)
  - Free-text search query matching treatment names and summaries
  - Saved ("Save to ask my doctor") treatment ids
  - Safety red-flag checkboxes

computes:
  - "Filtered list of evidence entries from the verified catalog"
  - "Saved shortlist of options to print"
  - "Urgent triggers from any ticked safety red flags"

shows:
  - Urgent guidance first when any safety trigger applies, including 988 (US) and Samaritans 116 123 (UK)
  - Evidence grade badge, summary of guideline findings, and source citation for each matching option
  - Printable shortlist of saved options, plus Clear my shortlist and filters
  - Her saved, dated shortlists (open, update, re-date, rename, delete)

never:
  - Recommend that the reader take, start, stop, or change any medication or supplement
  - Give individual dosing instructions
  - Show affiliate links, product cards, or commercial calls to action inside the tool
  - Send searches, filters, or saved options off the device

limits:
  - Evidence grades summarize population-level clinical trials and society guidelines, not individual suitability
  - Personal contraindications (such as hormone-sensitive cancer history, liver disease, or clotting history) must be reviewed by a clinician

urgent_triggers: [self_harm_thoughts, palpitations_red_flags, bleeding_after_menopause, heavy_or_unusual_bleeding]
sources: [nams-2022-hormone-therapy, nams-2023-nonhormone-therapy, veozah-prescribing-information, lynkuet-approval-bayer-2025, nams-2020-gsm, acog-clinical-consensus-gsm, cochrane-vaginal-moisturizers, nice-ng123-urinary-incontinence, cochrane-pfmt-incontinence, liftmor-trial-bone-density, nhs-postmenopausal-bleeding, nhs-heart-palpitations, lifeline-988]

privacy: >-
  Filters and the current shortlist autosave in this browser's IndexedDB (menowell_local_db, toolRecords) on her device; dated shortlists she chooses to save are kept there too. Data from the older localStorage key (menoverdict_evidence_checker_v1) is moved in once, then that key is removed. No account or login. Nothing is sent to a server, analytics, or partners. Everything is included in the backup file she can download and restore from /app/storage/, and nothing is deleted automatically: she deletes entries one at a time, by date range, by tool, or all at once.

