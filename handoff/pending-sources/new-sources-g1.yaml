- id: lynkuet-prescribing-information
  title: LYNKUET (elinzanetant) capsules, prescribing information
  authors: []
  publisher: Bayer HealthCare Pharmaceuticals Inc. (FDA-approved label, via DailyMed, U.S. National Library of Medicine)
  year: 2026
  type: regulator_label
  url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=f42884ff-7dff-419c-8a0c-affe2ed73818
  doi: null
  accessed: "2026-11-08"
  population: Adults with moderate to severe vasomotor symptoms due to menopause
  key_finding: "Indicated for moderate to severe vasomotor symptoms due to menopause. No boxed warning. Warnings and precautions: 5.1 CNS depressant effect and daytime impairment (sleepiness and other nervous system effects in 11.9% vs 3.5% on placebo; avoid driving or hazardous activities until effects resolve); 5.2 hepatic transaminase elevations (baseline liver bloodwork; do not start if transaminases or total bilirubin are 2 or more times the upper limit of normal; repeat at 3 months); 5.3 risk of pregnancy loss (contraindicated in pregnancy); 5.4 risk of seizure."
  funding_conflict: Manufacturer-issued label (FDA-approved text)
  verified: true
  notes: "Label text reads 'Revised: 8/2026'. Duplicate of g7's entry; dedupe on merge."
