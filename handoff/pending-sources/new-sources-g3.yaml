# New sources proposed by content group g3 (anxiety, weight-gain). Each was opened on 2026-11-08.

- id: nimh-generalized-anxiety-disorder
  title: "Generalized Anxiety Disorder: When Worry Gets Out of Control"
  authors: []
  publisher: National Institute of Mental Health (NIH)
  year: 2025
  type: patient_information
  url: https://www.nimh.nih.gov/health/publications/generalized-anxiety-disorder-gad
  doi: null
  accessed: "2026-11-08"
  population: General public (US)
  key_finding: "Lists GAD symptoms (excessive worry, feeling on edge or irritable, restlessness, trouble concentrating, trouble sleeping or fatigue, headaches, muscle aches, stomachaches or tension). A health care provider may do a physical exam to make sure an unrelated physical problem is not causing the symptoms. Treatment usually involves psychotherapy, medication or both; CBT is described as the well-studied 'gold standard' psychotherapy. Medications include SSRIs and SNRIs (which can take several weeks to work and may cause headaches, nausea or difficulty sleeping), benzodiazepines (tolerance and dependence possible, so often prescribed only briefly) and buspirone (3-4 weeks to be fully effective). Gives crisis guidance: call or text 988; in life-threatening situations, call 911."
  funding_conflict: null
  verified: true
  notes: "NIMH publication, revised 2025. Not menopause-specific: use for general anxiety treatment facts and US crisis numbers."

- id: nhs-urgent-help-mental-health
  title: Where to get urgent help for mental health
  authors: []
  publisher: NHS (nhs.uk)
  year: 2026
  type: patient_information
  url: https://www.nhs.uk/nhs-services/mental-health-services/where-to-get-urgent-help-for-mental-health/
  doi: null
  accessed: "2026-11-08"
  population: General public (UK)
  key_finding: "For urgent mental health help, get advice from NHS 111 (call 111 and choose the mental health option, or use 111 online) or ask for an urgent GP appointment. Call 999 or go to A&E now if someone's life is at risk, for example they have seriously injured themselves or taken an overdose. Samaritans offer a free, confidential listening service on 116 123."
  funding_conflict: null
  verified: true
  notes: Page last reviewed 23 October 2026.

