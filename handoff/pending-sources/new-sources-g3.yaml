- id: nhs-underactive-thyroid-symptoms
  title: "Underactive thyroid (hypothyroidism): Symptoms"
  authors: []
  publisher: NHS (nhs.uk)
  year: 2025
  type: patient_information
  url: https://www.nhs.uk/conditions/underactive-thyroid-hypothyroidism/symptoms/
  doi: null
  accessed: "2026-11-08"
  population: General public (UK)
  key_finding: "Symptoms include feeling extremely tired, feeling cold more than usual, putting on weight, low mood or depression, constipation, difficulty concentrating, dry skin or hair or hair loss, a hoarse voice, and irregular or heavy periods. Many symptoms are common and can have other causes, so they should be checked by a GP; blood tests check TSH and thyroxine (T4)."
  funding_conflict: null
  verified: true
  notes: Page last reviewed 28 April 2025. The page does not mention menopause.

- id: lovejoy-visceral-fat-menopause-2008
  title: Increased visceral fat and decreased energy expenditure during the menopausal transition
  authors: [Lovejoy JC, Champagne CM, de Jonge L, Xie H, Smith SR]
  publisher: International Journal of Obesity
  year: 2008
  type: cohort
  url: https://pubmed.ncbi.nlm.nih.gov/18332882/
  doi: 10.1038/ijo.2008.25
  accessed: "2026-11-08"
  population: "156 healthy, initially premenopausal women (103 Caucasian, 53 African-American) measured yearly for 4 years (DEXA, CT, accelerometry; calorimetry in a subset of 34)"
  key_finding: "Body fat and weight increased significantly only in women who became postmenopausal by year 4 (n=51). All women gained subcutaneous abdominal fat with age, but only those who became postmenopausal had a significant increase in visceral fat. Physical activity fell significantly 2 years before menopause and stayed low. Sleeping energy expenditure fell 1.5-fold more in women who became postmenopausal (-7.9% vs -5.3%), and fat oxidation fell 32% in that group. Authors conclude menopause onset is associated with lower energy expenditure and fat oxidation that can predispose to obesity if lifestyle changes are not made."
  funding_conflict: null
  verified: true
  notes: "Abstract read via NCBI E-utilities efetch. Small single-center cohort (Pennington Biomedical); funding and disclosures not checked."

- id: davis-ims-weight-gain-menopause-2012
  title: Understanding weight gain at menopause
  authors: [Davis SR, Castelo-Branco C, Chedraui P, Lumsden MA, Nappi RE, Shah D, Villaseca P]
  publisher: Climacteric (International Menopause Society, World Menopause Day 2012 writing group)
  year: 2012
  type: other
  url: https://pubmed.ncbi.nlm.nih.gov/22978257/
  doi: 10.3109/13697137.2012.707385
  accessed: "2026-11-08"
  population: Literature review of studies on menopause, midlife, body weight and body composition
  key_finding: "Weight gain per se cannot be attributed to the menopause transition, but the hormonal change at menopause is associated with an increase in total body fat and in abdominal fat. Weight excess at midlife is associated with higher risk of cardiovascular and metabolic disease and affects quality of life and sexual function. Studies mostly show less overall fat mass with estrogen or estrogen-progestin therapy, but further studies are needed to identify which women benefit before evidence-based clinical recommendations can be made."
  funding_conflict: null
  verified: true
  notes: "Abstract read via NCBI E-utilities efetch. Narrative review, not a systematic review, so typed 'other'. Author disclosures not checked."
