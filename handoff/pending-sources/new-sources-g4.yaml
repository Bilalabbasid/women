- id: medlineplus-iron-deficiency-anemia
  title: "Iron deficiency anemia: MedlinePlus Medical Encyclopedia"
  authors: []
  publisher: MedlinePlus, US National Library of Medicine (NIH)
  year: 2025
  type: patient_information
  url: https://medlineplus.gov/ency/article/000584.htm
  doi: null
  accessed: "2026-11-08"
  population: General public (US)
  key_finding: "Heavy, long or frequent menstrual periods are a common cause of the blood loss that leads to iron deficiency anemia. Early symptoms include feeling weak or tired more often than usual or with exercise, and problems concentrating or thinking."
  funding_conflict: null
  verified: true
  notes: Review date 4/1/2025. The page does not describe low iron without anemia as a separate stage.

- id: medlineplus-vaginal-uterine-bleeding
  title: "Vaginal or uterine bleeding: MedlinePlus Medical Encyclopedia"
  authors: []
  publisher: MedlinePlus, US National Library of Medicine (NIH)
  year: 2024
  type: patient_information
  url: https://medlineplus.gov/ency/article/007496.htm
  doi: null
  accessed: "2026-11-08"
  population: General public (US)
  key_finding: "Contact your provider if you soak through a pad or tampon every hour for 2 to 3 hours, bleeding lasts longer than 1 week, you bleed and are or could be pregnant, have severe pain, periods have been heavier or longer than normal for 3 or more cycles, bleed after menopause, between periods or after sex, bleeding becomes heavy enough to cause weakness or lightheadedness, or you have fever or lower abdominal pain. Causes of abnormal uterine bleeding include irregular or absent ovulation (more common approaching menopause), fibroids, polyps, adenomyosis, thyroid or pituitary disorders, PCOS, pregnancy complications, infection, certain cancers, bleeding disorders, IUDs and medicines such as blood thinners."
  funding_conflict: null
  verified: true
  notes: Review date 10/15/2024. Advises contacting a provider; it gives no 911/emergency threshold for heavy menstrual bleeding.

- id: cdc-heavy-menstrual-bleeding
  title: "About Heavy Menstrual Bleeding"
  authors: []
  publisher: Centers for Disease Control and Prevention (CDC)
  year: 2024
  type: patient_information
  url: https://www.cdc.gov/ncbddd/blooddisorders/women/menorrhagia.html
  doi: null
  accessed: "2026-11-08"
  population: General public (US)
  key_finding: "Signs of heavy menstrual bleeding: changing a tampon or pad after less than 2 hours; soaking through one or more pads or tampons every hour for several hours in a row; doubling up on pads; changing pads or tampons during the night; periods lasting more than 7 days; blood clots the size of a quarter or larger; flow that stops normal activities; constant lower stomach pain during periods; being tired, low on energy or short of breath. People with these signs should see a healthcare provider."
  funding_conflict: null
  verified: true
  notes: Page dated May 15, 2024 (may redirect to a newer CDC URL).
